<html lang="en">
<head>

  <style>
    :root{color-scheme:light;--accent:#0b7fc3;--accent-2:#075f93;--bg:#f6f7f9;--panel:#fff;--panel-2:#f7f7f8;--line:#d6d9de;--text:#111827;--muted:#5f6875;--nav:#080808;--navText:#f5f5f5;--navActive:#1a1a1a;--input:#fff;--table:#f1f2f4;--shadow:0 12px 28px rgba(0,0,0,.10);--red:#b42318;--amber:#9a5b00;--green:#087443;--focus:#0b7fc3}

    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.hide{display:none!important}button,a,input,select{font:inherit}a{color:var(--accent-2);text-decoration:none}a:hover{text-decoration:underline}button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:4px;padding:8px 12px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:disabled:hover{box-shadow:none;border-color:var(--line)}button:hover{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}html[data-theme="dark"] button{background:#161616;color:var(--text);border-color:var(--line)}html[data-theme="dark"] button.primary{background:var(--accent);border-color:var(--accent);color:#fff}html[data-theme="dark"] button.iconAction.primary,html[data-theme="dark"] .bulkButton.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.danger{color:var(--red)}button.warning{color:var(--amber)}button.iconBtn{width:40px;height:40px;border-radius:8px;padding:0;display:grid;place-items:center;background:var(--panel);box-shadow:var(--shadow)}button.loginTheme{position:fixed;right:18px;top:16px;z-index:20}input,select{width:100%;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:9px 10px}label{display:block;margin:10px 0 5px;font-weight:650}.muted{color:var(--muted)}.err{color:var(--red);margin-top:8px}.ok{color:var(--green)}.app{display:grid;grid-template-columns:82px 1fr;min-height:100vh}.app.expanded{grid-template-columns:248px 1fr}nav{background:var(--nav);color:var(--navText);border-right:1px solid rgba(255,255,255,.08);padding:14px 10px;position:sticky;top:0;height:100vh;box-shadow:8px 0 28px rgba(0,0,0,.16);display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding:4px;cursor:pointer}.brandName{display:none;font-weight:750;line-height:1.1}.app.expanded .brandName{display:block}.navToggle{margin-left:auto;width:36px;height:36px;padding:0;color:var(--navText);background:transparent;border:0;box-shadow:none;border-radius:4px;font-size:21px}.navToggle:hover{background:rgba(255,255,255,.08);box-shadow:none;border:0}.app:not(.expanded) .brand{display:grid;place-items:center;gap:10px}.app:not(.expanded) .navToggle{margin:0}.app.expanded .navToggle{margin-left:auto}.brandLogo{width:50px;height:50px;border-radius:6px;object-fit:contain;background:transparent;border:0}.nav a{height:48px;display:flex;align-items:center;gap:12px;color:var(--navText);text-decoration:none;border-radius:5px;margin:7px 0;border:1px solid transparent;padding:0 12px;position:relative}.nav a.active{background:var(--navActive);border-color:transparent;box-shadow:inset 4px 0 0 var(--accent),0 8px 24px rgba(0,0,0,.18)}.nav a:hover{background:var(--navActive);border-color:transparent}.navBadge{background:var(--red);color:#fff;border-radius:999px;padding:1px 6px;font-size:11px;margin-left:5px}.navIcon{font-size:20px;width:28px;text-align:center;color:var(--navText);line-height:1}.navLabel{display:none;font-size:14px;font-weight:650;line-height:1.1}.app.expanded .navLabel{display:inline}.login{max-width:430px;margin:9vh auto;background:var(--panel);border:1px solid var(--line);padding:30px;border-radius:22px;box-shadow:var(--shadow)}.loginLogo{display:block;width:92px;height:92px;border-radius:22px;object-fit:contain;margin:0 auto 16px;background:transparent;border:0;box-shadow:none}.login h1{text-align:center;margin:0 0 6px;font-size:25px}.login .muted{text-align:center;margin-bottom:20px}.loginActions{display:grid;gap:10px;margin-top:16px}.ssoBtn{text-align:center;text-decoration:none;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:4px;padding:9px 12px}.or{text-align:center;color:var(--muted);font-size:12px}.page{padding:22px 28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-right:52px}.top h1{margin:0;font-size:25px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line);background:var(--panel-2)}.panel-h h2{margin:0;font-size:16px}.panel-b{padding:16px}.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;box-shadow:var(--shadow)}.metric b{display:block;font-size:24px;margin-top:4px}.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;margin-bottom:12px}.actionsBar{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}th{background:var(--table);font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}tr:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}.rowActions{display:flex;gap:6px;flex-wrap:wrap}.low,.succeeded,.installed{color:var(--green)}.medium,.high,.available{color:var(--amber)}.critical,.failed{color:var(--red)}.skipped{color:var(--muted)}.toast{position:fixed;right:18px;top:66px;z-index:50;max-width:520px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);box-shadow:var(--shadow);border-radius:5px;padding:12px;white-space:pre-wrap}.confirmOverlay{position:fixed;inset:0;background:rgba(4,13,22,.42);z-index:60;display:grid;place-items:center}.confirmBox{width:min(440px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}.confirmActions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}.iconAction{width:34px;height:34px;border-radius:4px;padding:0;display:inline-grid;place-items:center}.iconAction.primary{background:var(--accent);color:white}.iconAction.danger{color:var(--red)}.drawer{position:fixed;right:0;top:0;width:min(560px,96vw);height:100vh;background:var(--panel);border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(0,0,0,.22);padding:20px;overflow:auto;transform:translateX(105%);transition:.18s;z-index:30}.drawer.open{transform:translateX(0)}pre{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:12px;overflow:auto;white-space:pre-wrap}.settingsGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.checkRow{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:5px;padding:10px;background:var(--panel-2)}.checkRow input{width:auto;margin-top:4px}.statusLine{margin-top:8px}.nowrap{white-space:nowrap}@media(max-width:900px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;gap:8px}.brand{margin:0}.nav{display:flex;gap:6px}.nav a{width:62px}.page{padding:18px}.strip,.filters,.settingsGrid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.panel{overflow:auto}}

    .navControls{margin-top:auto;display:flex;gap:10px;justify-content:center;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)}.navControls .iconBtn{position:static;width:44px;height:44px;border-radius:0;background:transparent;border:0;color:#f5f5f5;box-shadow:none;font-size:24px}.navControls .iconBtn:hover{background:rgba(255,255,255,.08);border-radius:10px}.app:not(.expanded) .navControls{flex-direction:column;align-items:center}.app.expanded .navControls{flex-direction:row}.settingsTabs{display:flex;gap:28px;align-items:flex-end;margin:4px 0 18px;border-bottom:1px solid var(--line)}.settingsTab{background:transparent!important;border:0;border-radius:0;box-shadow:none!important;color:var(--muted);font-size:15px;font-weight:700;padding:9px 0 11px;position:relative}.settingsTab.active{color:var(--text)}.settingsTab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:4px;background:var(--accent);border-radius:3px 3px 0 0}.settingsPanel{margin-top:4px}.top{align-items:flex-start}.topActions{margin-left:auto;display:flex;gap:10px;align-items:center;justify-content:flex-end}.topActions .iconBtn{position:static;box-shadow:var(--shadow);flex:0 0 44px;width:44px;height:44px;font-size:20px}.rowActions{display:flex;gap:8px;align-items:center;white-space:nowrap;flex-wrap:nowrap}.rowActions .iconAction{width:42px;height:42px;min-width:42px;font-size:21px;padding:0}.bulkButton{height:38px;border-radius:5px;display:inline-flex;align-items:center;gap:8px;font-weight:700}.sortHead{cursor:pointer;user-select:none}.sortHead:hover{color:var(--accent)}.sortMark{font-size:11px;margin-left:5px;color:var(--muted)}.statusPill{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:5px 9px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);font-size:12px;font-weight:750}.statusPill::before{content:"";width:8px;height:8px;border-radius:999px;background:currentColor}.statusPill.healthy{color:var(--green);background:color-mix(in srgb,var(--green) 13%,transparent);border-color:color-mix(in srgb,var(--green) 45%,var(--line))}.statusPill.warning{color:var(--amber);background:color-mix(in srgb,var(--amber) 15%,transparent);border-color:color-mix(in srgb,var(--amber) 45%,var(--line))}.statusPill.degraded{color:#f97316;background:color-mix(in srgb,#f97316 14%,transparent);border-color:color-mix(in srgb,#f97316 45%,var(--line))}.statusPill.offline,.statusPill.critical,.statusPill.auth_failed{color:var(--red);background:color-mix(in srgb,var(--red) 13%,transparent);border-color:color-mix(in srgb,var(--red) 45%,var(--line))}.statusPill.ssl_expiring{color:#a855f7;background:color-mix(in srgb,#a855f7 15%,transparent);border-color:color-mix(in srgb,#a855f7 45%,var(--line))}.statusPill.unknown{color:var(--muted)}.statusInfo{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:800;margin-left:8px;cursor:help;background:var(--panel-2)}.statusInfo.warning{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,var(--line));background:color-mix(in srgb,var(--amber) 12%,transparent)}.statusInfo.offline,.statusInfo.critical,.statusInfo.auth_failed{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--line));background:color-mix(in srgb,var(--red) 12%,transparent)}.statusInfo.healthy{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,var(--line));background:color-mix(in srgb,var(--green) 10%,transparent)}.progressCell{min-width:140px}.progressBar{height:7px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden;margin-top:5px}.progressFill{height:100%;width:45%;background:var(--accent-2);animation:progressPulse 1.3s ease-in-out infinite}.progressText{font-size:12px;color:var(--muted);white-space:nowrap}@keyframes progressPulse{0%{opacity:.45}50%{opacity:1}100%{opacity:.45}}.dangerIcon{color:var(--red)}.activityFeed{display:grid;gap:8px;margin-bottom:18px}.activityItem{display:grid;grid-template-columns:150px 110px 1fr auto;gap:12px;align-items:center;padding:9px 10px;border:1px solid var(--line);background:var(--panel-2);border-radius:6px}.activityTime{font-weight:750}.activityType{text-transform:uppercase;font-size:11px;letter-spacing:.06em;color:var(--muted)}.activityLabel{font-weight:650}.activityResult{font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:999px}.activityResult.succeeded,.activityResult.success,.activityResult.completed{color:var(--green)}.activityResult.failed,.activityResult.error,.activityResult.unsupported_or_failed{color:var(--red)}.panel-b table{table-layout:fixed;width:100%}.panel-b th,.panel-b td{white-space:normal;overflow-wrap:anywhere;word-break:break-word}.panel-b td:last-child{max-width:360px}.activityFeed{max-width:100%;overflow:hidden}@media(max-width:800px){.activityItem{grid-template-columns:1fr}.activityResult{justify-self:start}}
  </style>
</head>
<body>
  <button id="loginThemeBtn" class="iconBtn loginTheme" onclick="toggleTheme()" aria-label="Toggle theme">☾</button>
  <div id="toast" class="toast hide"></div>
  <div id="login" class="login hide">
    <img class="loginLogo" src="/assets/ha-fleet-manager-icon-transparent.png" alt="Home Assistant Fleet Manager logo">
    <h1>Home Assistant Fleet Manager</h1>
    <p class="muted">Manage updates across trusted Home Assistant instances.</p>
    <label for="email">Email or username</label><input id="email" autocomplete="username">
    <label for="password">Password</label><input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <div class="loginActions"><button class="primary" onclick="login()">Sign in</button><a id="oidcLogin" class="ssoBtn hide" href="/api/auth/oidc/start">Sign in with SSO</a></div>
    <div id="loginErr" class="err"></div>
  </div>
  <div id="app" class="app hide">
    <nav><div class="brand" onclick="route('Updates')" title="Home"><img class="brandLogo" src="/assets/ha-fleet-manager-icon-transparent.png" alt=""><div class="brandName">Home Assistant<br>Fleet Manager</div><button class="navToggle" onclick="event.stopPropagation();toggleNav()" title="Expand/collapse">☰</button></div><div class="nav" id="nav"></div><div class="navControls"><button class="iconBtn" onclick="syncAll()" title="Refresh" aria-label="Refresh">⟳</button><button id="themeBtn" class="iconBtn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">☾</button><button class="iconBtn" onclick="logout()" title="Logout" aria-label="Logout">⇥</button></div></nav>
    <main class="page"><div class="top"><div><h1 id="title">Updates</h1><div class="muted" id="subtitle">Select updates, review release notes if needed, then update or skip.</div></div></div><section id="content"></section></main>
  </div>
  <div id="drawer" class="drawer"></div>
  <div id="confirmOverlay" class="confirmOverlay hide"><div class="confirmBox"><h2 id="confirmTitle">Confirm</h2><p id="confirmText" class="muted"></p><div class="confirmActions"><button id="confirmCancel">Cancel</button><button id="confirmOk" class="primary">Confirm</button></div></div></div>
<script>
let csrf=null, data={instances:[],updates:[],repairs:[],dashboard:null,audit:[],operations:[],jobs:[],backups:[],notifications:[],policies:[],user:null,oidc:null};
let activePage=null, liveTimer=null, settingsTab=localStorage.getItem('hafm-settings-tab')||'Account';
const basePages=['Updates','Recent activity','Settings'];
const pageIcons={Updates:'⇧',Repairs:'⚠',Instances:'⌂','Recent activity':'◷',Settings:'⚙'};
function pages(){let p=[...basePages];if((data.repairs||[]).length)p.splice(1,0,'Repairs');return p}
let updateSort={key:'risk',dir:'desc'}, instanceSort={key:'friendly_name',dir:'asc'};
const $=id=>document.getElementById(id);
function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('hafm-theme',t);['themeBtn','loginThemeBtn'].forEach(id=>{let b=$(id);if(b)b.textContent=t==='dark'?'☀':'☾'})}
function toggleTheme(){applyTheme((document.documentElement.dataset.theme||'light')==='dark'?'light':'dark')}
applyTheme(localStorage.getItem('hafm-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function api(p,o={}){o.headers=o.headers||{};if(csrf)o.headers['x-csrf-token']=csrf;if(o.body&&typeof o.body!=='string'){o.headers['content-type']='application/json';o.body=JSON.stringify(o.body)}let r=await fetch(p,o);if(r.status===401){showLogin();throw new Error('Authentication required')}let j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.statusText);return j}
function savedPage(){let p=localStorage.getItem('hafm-page')||location.hash.replace(/^#/,'');if(p==='Instances'){settingsTab='Instance config';return 'Settings'}return pages().includes(p)?p:'Updates'}
async function boot(){await loadOidcConfig();try{let s=await api('/api/session');csrf=s.csrf_token;data.user=s.user;showApp();await load();route(savedPage())}catch(e){showLogin()}}
async function loadOidcConfig(){data.oidc=await fetch('/api/auth/oidc/config').then(r=>r.json()).catch(()=>({enabled:false}));let b=$('oidcLogin');if(b&&data.oidc?.enabled){b.textContent=data.oidc.button_label||'Sign in with SSO';b.classList.remove('hide')}}
function showLogin(){$('login').classList.remove('hide');$('app').classList.add('hide');$('loginThemeBtn')?.classList.remove('hide')}
function toggleNav(){let app=$('app');app.classList.toggle('expanded');localStorage.setItem('hafm-nav-expanded',app.classList.contains('expanded')?'1':'0')}
function navBadge(p){let n=p==='Repairs'?(data.repairs||[]).length:p==='Updates'?visibleUpdates().filter(u=>u.installation_state==='available'&&u.skip_state!=='skipped').length:0;return n?` <b class="navBadge">${n}</b>`:''}
function renderNav(){$('nav').innerHTML=pages().map(p=>`<a href="#" onclick="route('${p}');return false" id="nav-${p}" title="${p}"><span class="navIcon">${pageIcons[p]}</span><span class="navLabel">${p}${navBadge(p)}</span></a>`).join('')}
function showApp(){$('login').classList.add('hide');$('app').classList.remove('hide');$('loginThemeBtn')?.classList.add('hide');$('app').classList.toggle('expanded',localStorage.getItem('hafm-nav-expanded')==='1');renderNav()}
function notify(msg,kind='info'){let t=$('toast');t.textContent=msg;t.className='toast '+kind;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hide'),7000)}
function confirmDialog(text,title='Confirm'){return new Promise(resolve=>{confirmTitle.textContent=title;confirmText.textContent=text;confirmOverlay.classList.remove('hide');confirmCancel.onclick=()=>{confirmOverlay.classList.add('hide');resolve(false)};confirmOk.onclick=()=>{confirmOverlay.classList.add('hide');resolve(true)}})}
async function login(){try{loginErr.textContent='';let j=await api('/api/auth/login',{method:'POST',body:{email:email.value,password:password.value}});csrf=j.csrf_token;data.user=j.user;showApp();await load();route('Updates')}catch(e){loginErr.textContent=e.message}}
async function logout(){await api('/api/auth/logout',{method:'POST'});showLogin()}
async function load(){await loadCore()}
async function loadCore(){let [instances,updates,repairs]=await Promise.all([api('/api/instances'),api('/api/updates'),api('/api/repairs').catch(()=>[])]);data.instances=instances;data.updates=updates;data.repairs=repairs;renderNav?.()}
async function refreshActivity(){let [audit,notifications,operations,jobs,backups]=await Promise.all([api('/api/audit').catch(()=>[]),api('/api/notifications').catch(()=>[]),api('/api/operations').catch(()=>[]),api('/api/jobs').catch(()=>[]),api('/api/backups').catch(()=>[])]);Object.assign(data,{audit,notifications,operations,jobs,backups});if(activePage==='Recent activity')history()}
async function refreshSettings(){let [user,oidc,policies]=await Promise.all([api('/api/user/settings').catch(()=>data.user),api('/api/oidc/settings').catch(()=>data.oidc),api('/api/policies').catch(()=>[])]);Object.assign(data,{user,oidc,policies});if(activePage==='Settings')settings()}
function setPage(p){title.textContent=p;pages().forEach(x=>$('nav-'+x)?.classList.toggle('active',x===p));subtitle.textContent=p==='Updates'?'Select updates, review release notes if needed, then update or skip.':p==='Settings'?'Account and single sign-on configuration.':''}
function route(p){if(p==='Instances'){settingsTab='Instance config';p='Settings'}if(!pages().includes(p))p='Updates';activePage=p;localStorage.setItem('hafm-page',p);location.hash=p;drawer.classList.remove('open');setPage(p);if(p==='Updates')updates();else if(p==='Repairs')repairs();else if(p==='Instances')instances();else if(p==='Recent activity'){history();refreshActivity()}else if(p==='Settings'){settings();refreshSettings()}manageLivePolling()}
function metric(k,v){return `<div class="metric"><span class="muted">${k}</span><b>${v}</b></div>`}
function sameVersion(u){return u.installed_version&&u.available_version&&u.installed_version===u.available_version}
function sortVal(o,k){if(k==='version')return `${o.installed_version||''} ${o.available_version||''}`;if(k==='update')return o.component||'';if(k==='updates')return Number(o.available_updates||0);return o[k]??''}
function cmp(a,b,k){let av=sortVal(a,k),bv=sortVal(b,k);if(typeof av==='number'||typeof bv==='number')return Number(av)-Number(bv);return String(av).localeCompare(String(bv),undefined,{numeric:true,sensitivity:'base'})}
function sortRows(rows,state){return [...rows].sort((a,b)=>(state.dir==='asc'?1:-1)*cmp(a,b,state.key))}
function setSort(scope,key){let st=scope==='updates'?updateSort:instanceSort;if(st.key===key)st.dir=st.dir==='asc'?'desc':'asc';else{st.key=key;st.dir='asc'};scope==='updates'?renderUpdateRows():renderInstancesTable()}
function th(scope,key,label){let st=scope==='updates'?updateSort:instanceSort;let mark=st.key===key?(st.dir==='asc'?'▲':'▼'):'';return `<th class="sortHead" onclick="setSort('${scope}','${key}')">${label}<span class="sortMark">${mark}</span></th>`}
function visibleUpdates(){let rows=data.updates.filter(u=>!sameVersion(u));let q=($('fSearch')?.value||'').toLowerCase(), inst=$('fInstance')?.value||'', cat=$('fCategory')?.value||'', risk=$('fRisk')?.value||'', status=$('fStatus')?.value||'available';return rows.filter(u=>(!q||`${u.component} ${u.entity_id} ${u.instance}`.toLowerCase().includes(q))&&(!inst||String(u.instance_id)===inst)&&(!cat||u.category===cat)&&(!risk||u.risk_level===risk)&&(status==='all'||(status==='available'?u.installation_state==='available'&&u.skip_state!=='skipped':status==='skipped'?u.skip_state==='skipped':u.installation_state===status)))}
function updateMetrics(){let rows=data.updates.filter(u=>!sameVersion(u)), pending=rows.filter(u=>u.installation_state==='available'&&u.skip_state!=='skipped');return `<div class="strip">${metric('Pending',pending.length)}${metric('Instances',new Set(pending.map(u=>u.instance_id)).size)}${metric('High risk',pending.filter(u=>['high','critical'].includes(u.risk_level)).length)}${metric('Skipped',rows.filter(u=>u.skip_state==='skipped').length)}</div>`}
function updates(){let rows=data.updates.filter(u=>!sameVersion(u)), cats=[...new Set(rows.map(u=>u.category).filter(Boolean))].sort(), risks=[...new Set(rows.map(u=>u.risk_level).filter(Boolean))].sort();content.innerHTML=`${updateMetrics()}<div class="panel"><div class="panel-h"><h2>Updates</h2><div class="toolbar"><button class="bulkButton danger" onclick="bulkAction('skip')" title="Skip selected" aria-label="Skip selected">⊘ <span>Skip selected</span></button><button class="bulkButton primary" onclick="bulkAction('update')" title="Update selected" aria-label="Update selected">⇧ <span>Update selected</span></button></div></div><div class="panel-b"><div class="filters"><input id="fSearch" placeholder="Search update" oninput="renderUpdateRows()"><select id="fInstance" onchange="renderUpdateRows()"><option value="">All instances</option>${data.instances.map(i=>`<option value="${i.id}">${esc(i.friendly_name)}</option>`).join('')}</select><select id="fCategory" onchange="renderUpdateRows()"><option value="">All types</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><select id="fRisk" onchange="renderUpdateRows()"><option value="">All risk levels</option>${risks.map(r=>`<option>${esc(r)}</option>`).join('')}</select><select id="fStatus" onchange="renderUpdateRows()"><option value="available">Pending only</option><option value="skipped">Skipped</option><option value="installed">Updated</option><option value="all">All statuses</option></select></div><div class="actionsBar"><span id="selCount" class="muted">0 selected</span></div><div id="updatesTable"></div></div></div>`;renderUpdateRows()}
function rowStatus(u){if(u.in_progress)return 'installing';if(u.skip_state==='skipped')return 'skipped';return esc(u.installation_state)}
function progressWidget(u){if(!u.in_progress)return '<span class="muted">—</span>';let p=Number.isFinite(Number(u.progress))?Number(u.progress):null;let w=p===null?45:p;return `<div class="progressCell"><div class="progressText">Installing${p===null?'':` · ${p}%`}</div><div class="progressBar"><div class="progressFill" style="width:${w}%"></div></div></div>`}
function updateActionButton(u){if(u.skip_state==='skipped')return '<button class="iconAction primary" disabled title="Skipped — re-enable in Home Assistant first" aria-label="Skipped">⇧</button>';return `<button class="iconAction primary" onclick="installUpdate(${u.id})" title="Update" aria-label="Update">⇧</button>`}
function renderUpdateRows(){let rows=sortRows(visibleUpdates(),updateSort);$('updatesTable').innerHTML=`<table><thead><tr><th><input id="selectAll" type="checkbox" onchange="toggleAll(this.checked)"></th>${th('updates','instance','Instance')}${th('updates','update','Update')}${th('updates','category','Type')}${th('updates','version','Current → Available')}<th>Progress</th><th>Actions</th></tr></thead><tbody>${rows.map(u=>`<tr><td><input class="upd" value="${u.id}" type="checkbox" onchange="countSelected()"></td><td><a href="#" onclick="openHaInstance(${u.instance_id});return false">${esc(u.instance||'')}</a></td><td><b>${esc(u.component)}</b><br><span class="muted">${esc(u.entity_id)}</span></td><td>${esc(u.category)}</td><td>${esc(u.installed_version||'—')} → <b>${esc(u.available_version||'—')}</b></td><td>${progressWidget(u)}</td><td><div class="rowActions"><button class="iconAction" onclick="detail(${u.id})" title="Open details" aria-label="Open details">⌕</button>${updateActionButton(u)}<button class="iconAction danger" onclick="skipOne(${u.id})" title="Skip" aria-label="Skip">⊘</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="muted">No matching updates.</td></tr>'}</tbody></table>`;countSelected()}
function manageLivePolling(){let any=(data.updates||[]).some(u=>u.in_progress);if(liveTimer){clearInterval(liveTimer);liveTimer=null}if(activePage==='Updates'&&any)liveTimer=setInterval(async()=>{try{await load();if(activePage==='Updates'){updates();notify('Update progress refreshed','info')}}catch(e){}},5000)}
function toggleAll(checked){document.querySelectorAll('.upd').forEach(x=>x.checked=checked);countSelected()}function selectedIds(){return [...document.querySelectorAll('.upd:checked')].map(x=>Number(x.value))}function countSelected(){let n=selectedIds().length;if($('selCount'))$('selCount').textContent=`${n} selected`}
async function bulkAction(action, ids=null){ids=ids||selectedIds();if(!ids.length)return notify('Select updates first','err');let verb={update:'update selected updates',skip:'skip selected updates'}[action];if(!await confirmDialog(verb,'Confirm action'))return;try{notify(`${verb} started…`);let j=await api('/api/updates/bulk',{method:'POST',body:{action,update_ids:ids}});notify(summaryText(j),j.failed?.length?'err':'ok');setTimeout(async()=>{await load();route('Updates')},800)}catch(e){notify(e.message,'err')}}
function summaryText(j){let failed=j.failed?.length||0,blocked=j.blocked?.length||0;if(failed)return `${j.action}: ${failed} failed`;if(blocked)return `${j.action}: ${blocked} blocked`;if(j.updated)return `Updated ${j.updated} update${j.updated===1?'':'s'}`;if(j.skipped)return `Skipped ${j.skipped} update${j.skipped===1?'':'s'}`;if(j.reviewed)return `Reviewed ${j.reviewed} update${j.reviewed===1?'':'s'}`;return `${j.action}: done`}
function plainReason(r){return String(r||'').replaceAll('_',' ').replaceAll(':',': ')}
function instanceById(id){return data.instances.find(i=>Number(i.id)===Number(id))}
function openHaInstance(id){let i=instanceById(id);if(!i||!i.url)return notify('Home Assistant URL not configured','err');window.open(i.url,'_blank','noopener')}
function openHaRepairs(id){let i=instanceById(id);if(!i||!i.url)return notify('Home Assistant URL not configured','err');window.open(i.url.replace(/\/$/,'')+'/config/repairs','_blank','noopener')}
function instanceIssue(i){let conn=i.connectivity_state||'unknown', health=i.health_state||'unknown';if(conn==='auth_failed')return 'Token invalid — edit instance and replace token';if(conn==='offline')return 'Cannot reach HA — check URL, network, tunnel, or HA service';if(health==='warning'&&(i.critical_updates||0)>0)return `${i.critical_updates} high-risk update${i.critical_updates===1?'':'s'} pending — review Updates`;if((i.available_updates||0)>0)return `${i.available_updates} update${i.available_updates===1?'':'s'} pending`;if(conn==='online'&&health==='healthy')return 'No action needed';return 'Refresh fleet status to re-check';}
function statusClass(i){let conn=i.connectivity_state||'unknown', health=i.health_state||'unknown';if(conn==='auth_failed')return 'auth_failed';if(conn==='offline')return 'offline';if(health==='healthy')return 'healthy';if(health==='warning')return 'warning';if(health==='degraded')return 'degraded';if(health==='critical')return 'critical';if(health==='ssl_expiring')return 'ssl_expiring';return 'unknown'}
function instanceStatus(i){let conn=i.connectivity_state||'unknown', health=i.health_state||'unknown';let label=conn==='online'?(health==='healthy'?'online':`${conn} / ${health}`):conn;return `<span class="statusPill ${esc(statusClass(i))}" title="${esc(instanceIssue(i))}">${esc(label)}</span>`}
function statusInfo(i){return `<span class="statusInfo ${esc(statusClass(i))}" title="${esc(instanceIssue(i))}" aria-label="${esc(instanceIssue(i))}">i</span>`}
async function skipOne(id){return bulkAction('skip',[id])}
async function installUpdate(id){let u=data.updates.find(x=>x.id===id);if(!u)return;if(u.skip_state==='skipped')return notify('Skipped update — re-enable in HA first','err');if(!await confirmDialog(`Install ${u.component} ${u.available_version||''} now?`,'Confirm update'))return;try{notify('Update started…');let j=await api(`/api/updates/${id}/install`,{method:'POST'});notify(`${j.state} (${j.status})`,j.ok?'ok':'err');drawer.classList.remove('open');setTimeout(async()=>{await load();route('Updates')},1000)}catch(e){notify(e.message,'err')}}
function instanceTable(rows){rows=sortRows(rows,instanceSort);return `<table><thead><tr>${th('instances','friendly_name','Instance')}${th('instances','connectivity_state','Status')}${th('instances','environment','Environment')}${th('instances','ha_core_version','HA version')}${th('instances','updates','Updates')}${th('instances','last_update_scan','Last check')}<th>Actions</th></tr></thead><tbody>${rows.map(i=>`<tr><td><b><a href="#" onclick="openHaInstance(${i.id});return false">${esc(i.friendly_name)}</a></b><br><span class="muted">${esc(i.location||i.url||'')}</span></td><td>${instanceStatus(i)}${statusInfo(i)}</td><td>${esc(i.environment)}</td><td>${esc(i.ha_core_version||'—')}</td><td>${i.available_updates}</td><td>${esc(i.last_update_scan||'—')}</td><td><div class="rowActions"><button class="iconAction" onclick="backupOne(${i.id})" title="Backup" aria-label="Backup">⛁</button><button class="iconAction warning" onclick="restartInstance(${i.id},'${esc(i.friendly_name).replace(/'/g,'&#39;')}')" title="Restart Home Assistant" aria-label="Restart Home Assistant">⏻</button><button class="iconAction" onclick="openEditInstance(${i.id})" title="Edit" aria-label="Edit">✎</button><button class="iconAction danger" onclick="deleteInstance(${i.id},'${esc(i.friendly_name).replace(/'/g,'&#39;')}')" title="Delete" aria-label="Delete">⌫</button></div></td></tr>`).join('')}</tbody></table>`}
function renderInstancesTable(){let el=$('instancesTable');if(el)el.innerHTML=instanceTable(data.instances)}
function instances(){content.innerHTML=`<div class="strip">${metric('Instances',data.instances.length)}${metric('Online',data.instances.filter(i=>i.connectivity_state==='online').length)}${metric('Offline',data.instances.filter(i=>i.connectivity_state!=='online').length)}${metric('Updates',data.instances.reduce((n,i)=>n+(i.available_updates||0),0))}</div><div class="panel"><div class="panel-h"><h2>Instances</h2><button class="primary" onclick="openAddInstance()">Add Instance</button></div><div class="panel-b" id="instancesTable">${instanceTable(data.instances)}</div></div>`}
function repairs(){let rows=data.repairs||[];content.innerHTML=`<div class="strip">${metric('Repairs',rows.length)}${metric('Instances',new Set(rows.map(r=>r.instance_id)).size)}${metric('Fixable',rows.filter(r=>r.is_fixable).length)}${metric('Warnings',rows.filter(r=>r.severity==='warning').length)}</div><div class="panel"><div class="panel-h"><h2>Repairs</h2><button onclick="load().then(()=>repairs())">Refresh</button></div><div class="panel-b">${repairTable(rows)}</div></div>`}
function repairActionLabel(r){return r.action==='host_reboot'?'Reboot':'Fix'}
function repairAction(r){if(r.action)return `<button class="primary" onclick="fixRepair(${r.instance_id},'${esc(r.domain).replace(/'/g,'&#39;')}','${esc(r.issue_id).replace(/'/g,'&#39;')}','${esc(r.action).replace(/'/g,'&#39;')}','${esc(repairActionLabel(r)).replace(/'/g,'&#39;')}')">${esc(repairActionLabel(r))}</button>`;if(r.learn_more_url)return `<a href="${esc(r.learn_more_url)}" target="_blank" rel="noopener">Learn more</a>`;return `<a href="#" onclick="openHaRepairs(${r.instance_id});return false">Open Repairs</a>`}
async function fixRepair(instanceId,domain,issueId,action,label){if(!await confirmDialog(`${label} repair now? Home Assistant may restart or reboot if that is the repair action.`,'Run repair'))return;try{notify(`${label} requested…`);await api('/api/repairs/fix',{method:'POST',body:{instance_id:instanceId,domain,issue_id:issueId,action}});notify(`${label} requested`,'ok');await load();route('Repairs')}catch(e){notify(e.message,'err')}}
function repairTable(rows){return `<table><thead><tr><th>Instance</th><th>Severity</th><th>Issue</th><th>Domain</th><th>Action</th></tr></thead><tbody>${rows.map(r=>`<tr><td><a href="#" onclick="openHaInstance(${r.instance_id});return false">${esc(r.instance)}</a></td><td><span class="statusPill ${esc(r.severity==='error'?'critical':r.severity)}">${esc(r.severity)}</span></td><td><b>${esc(r.title)}</b><br><span class="muted">${esc(r.details)}</span></td><td>${esc(r.domain)}</td><td>${repairAction(r)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No repairs need attention.</td></tr>'}</tbody></table>`}
function history(){content.innerHTML=`<div class="panel"><div class="panel-h"><div></div><div class="toolbar"><button onclick="ackAllNotifications()">Acknowledge all open</button><button onclick="load().then(()=>history())">Refresh</button></div></div><div class="panel-b">${activityFeed()}<h3>Notifications</h3>${notificationTable(data.notifications)}<h3>Audit events</h3>${auditTable(data.audit)}<h3>Backups</h3>${backupTable(data.backups)}<h3>Operations</h3>${operationTable(data.operations)}</div></div>`}
function fmtTime(t){try{return new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch(e){return t||'—'}}
function activityRows(){return [...(data.audit||[]).map(x=>({time:x.timestamp,type:'audit',label:plainAction(x.action),result:x.result||'success',details:x.metadata||{}})),...(data.operations||[]).map(x=>({time:x.started_at,type:'operation',label:plainAction(x.kind)+' — '+(x.state||x.status||''),result:x.status,details:x.details||{}})),...(data.backups||[]).map(x=>({time:x.started_at,type:'backup',label:x.name||'Backup created',result:x.status,details:{backup_id:x.backup_id,instance_id:x.instance_id}})),...(data.notifications||[]).map(x=>({time:x.created_at,type:'notification',label:x.title,result:x.status,details:{severity:x.severity}}))].filter(x=>x.time).sort((a,b)=>String(b.time).localeCompare(String(a.time)))}
function activityFeed(){let rows=activityRows().slice(0,24);return `<div class="activityFeed">${rows.map(r=>`<div class="activityItem"><div class="activityTime">${esc(fmtTime(r.time))}</div><div class="activityType">${esc(r.type)}</div><div><div class="activityLabel">${esc(r.label)}</div><div class="muted">${esc(shortDetails(r.details))}</div></div><div class="activityResult ${esc(r.result)}">${esc(r.result||'success')}</div></div>`).join('')||'<div class="muted">No activity yet.</div>'}</div>`}
function shortDetails(d){if(!d)return '';if(d.instance||d.component)return [d.instance,d.component,d.reason].filter(Boolean).join(' · ');if(d.state)return d.state;if(d.severity)return d.severity;if(d.count!==undefined)return `${d.count} item(s)`;if(d.backup_id)return `backup ${d.backup_id}`;return Object.entries(d).slice(0,2).map(([k,v])=>`${k}: ${String(v).slice(0,60)}`).join(' · ')}
function backupTable(rows){return `<table><thead><tr><th>Started</th><th>Name</th><th>Status</th><th>Backup ID</th><th>Details</th></tr></thead><tbody>${(rows||[]).slice(0,80).map(b=>`<tr><td>${esc(b.started_at||'—')}</td><td>${esc(b.name||'backup')}</td><td>${esc(b.status)}</td><td>${esc(b.backup_id||'—')}</td><td>${esc(shortDetails(b.details||{}))}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No backups logged.</td></tr>'}</tbody></table>`}
function operationTable(rows){return `<table><thead><tr><th>Started</th><th>Kind</th><th>Status</th><th>State</th><th>Details</th></tr></thead><tbody>${(rows||[]).slice(0,80).map(o=>`<tr><td>${esc(o.started_at||'—')}</td><td>${esc(o.kind)}</td><td>${esc(o.status)}</td><td>${esc(o.state)}</td><td>${esc(shortDetails(o.details||{}))}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No operations logged.</td></tr>'}</tbody></table>`}
function auditTable(rows){return `<table><thead><tr><th>Time</th><th>Action</th><th>Result</th><th>Details</th></tr></thead><tbody>${rows.slice(0,80).map(a=>`<tr><td>${esc(a.timestamp)}</td><td>${plainAction(a.action)}</td><td>${esc(a.result||'success')}</td><td>${esc(shortDetails(a.metadata||{}))}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No history yet.</td></tr>'}</tbody></table>`}
function notificationTable(rows){return `<table><thead><tr><th>Severity</th><th>Message</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody>${rows.slice(0,80).map(n=>`<tr><td>${esc(n.severity)}</td><td><b>${esc(n.title)}</b><br><span class="muted">${esc(n.body)}</span></td><td>${esc(n.status)}</td><td>${esc(n.created_at)}</td><td>${n.status==='open'?`<button onclick="ackNotification(${n.id})">Acknowledge</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No notifications.</td></tr>'}</tbody></table>`}
function plainAction(a){return esc(String(a||'').replaceAll('_',' '))}
function settingsTabs(){let tabs=['Account','OIDC','Instance config'];return `<div class="settingsTabs">${tabs.map(t=>`<button class="settingsTab ${settingsTab===t?'active':''}" onclick="setSettingsTab('${t}')">${t}</button>`).join('')}</div>`}
function setSettingsTab(t){settingsTab=t;localStorage.setItem('hafm-settings-tab',t);settings()}
function settings(){if(!['Account','OIDC','Instance config'].includes(settingsTab))settingsTab='Account';content.innerHTML=`${settingsTabs()}<div class="settingsPanel">${settingsTab==='Account'?accountSettings():settingsTab==='OIDC'?oidcSettings():instanceConfigSettings()}</div>`}
function accountSettings(){let u=data.user||{};return `<div class="panel"><div class="panel-b"><label>Name</label><input id="setName" value="${esc(u.display_name||'')}"><label>Username</label><input id="setUsername" value="${esc(u.username||'')}"><label>Email</label><input id="setEmail" value="${esc(u.email||'')}"><label>Current password <span class="muted">required for email/password changes</span></label><input id="setCurrentPassword" type="password"><label>New password</label><input id="setNewPassword" type="password" placeholder="12+ characters"><p><button class="primary" onclick="saveUserSettings()">Save account</button></p><div id="settingsMsg" class="statusLine"></div></div></div>`}
function oidcSettings(){let o=data.oidc||{};return `<div class="panel"><div class="panel-b" aria-label="Single sign-on settings"><label class="checkRow"><input id="oidcEnabled" type="checkbox" ${o.enabled?'checked':''}><span><b>Enable OIDC</b><br><span class="muted">Adds a SSO option on the login screen.</span></span></label><label>Issuer URL</label><input id="oidcIssuer" placeholder="https://auth.example.com/application/o/fleet/" value="${esc(o.issuer_url||'')}"><label>Client ID</label><input id="oidcClientId" value="${esc(o.client_id||'')}"><label>Client secret</label><input id="oidcClientSecret" type="password" placeholder="${o.client_secret_configured?'Configured — leave blank to keep':'Paste client secret'}"><label>Scopes</label><input id="oidcScopes" value="${esc(o.scopes||'openid email profile')}"><label>Login button label</label><input id="oidcButtonLabel" value="${esc(o.button_label||'Sign in with SSO')}"><p class="muted">Redirect URI: <code>${location.origin}/api/auth/oidc/callback</code></p><p><button class="primary" onclick="saveOidcSettings()">Save SSO</button></p><div id="oidcMsg" class="statusLine"></div></div></div>`}
function instanceConfigSettings(){return `<div class="panel"><div class="panel-h"><div></div><button class="primary" onclick="openAddInstance()">Add Instance</button></div><div class="panel-b" id="instancesTable">${instanceTable(data.instances)}</div></div>`}
async function saveUserSettings(){try{let body={display_name:setName.value,username:setUsername.value,email:setEmail.value,current_password:setCurrentPassword.value||null,new_password:setNewPassword.value||null};data.user=await api('/api/user/settings',{method:'PATCH',body});settingsMsg.className='ok statusLine';settingsMsg.textContent='Saved.';setCurrentPassword.value='';setNewPassword.value=''}catch(e){settingsMsg.className='err statusLine';settingsMsg.textContent=e.message}}
async function saveOidcSettings(){try{data.oidc=await api('/api/oidc/settings',{method:'PATCH',body:{enabled:oidcEnabled.checked,issuer_url:oidcIssuer.value,client_id:oidcClientId.value,client_secret:oidcClientSecret.value||null,scopes:oidcScopes.value,button_label:oidcButtonLabel.value}});oidcMsg.className='ok statusLine';oidcMsg.textContent='Saved.';await loadOidcConfig()}catch(e){oidcMsg.className='err statusLine';oidcMsg.textContent=e.message}}
function detail(id){let u=data.updates.find(x=>x.id===id);drawer.classList.add('open');drawer.innerHTML=`<button onclick="drawer.classList.remove('open')">Close</button><h2>${esc(u.component)}</h2><p><a href="#" onclick="openHaInstance(${u.instance_id});return false">${esc(u.instance||'')}</a> · ${esc(u.category)}</p><div class="toolbar">${updateActionButton(u)}<button class="iconAction danger" onclick="skipOne(${u.id})" title="Skip">⊘</button></div><table><tr><th>Version</th><td>${esc(u.installed_version||'—')} → ${esc(u.available_version||'—')}</td></tr><tr><th>Risk</th><td class="${esc(u.risk_level)}">${esc(u.risk_level)}</td></tr><tr><th>Status</th><td>${rowStatus(u)}</td></tr></table><h3>Notes</h3><pre>${esc(u.breaking_excerpt||u.release_notes||'No release notes captured. Open the release link before updating if one is available.')}</pre>${u.release_url?`<p><a href="${esc(u.release_url)}" target="_blank" rel="noopener">Open release notes</a></p>`:''}`}
async function syncAll(){notify('Refresh started…');await api('/api/sync-all',{method:'POST'});await load();route(title.textContent)}async function syncOne(id){notify('Instance refresh started…');await api(`/api/instances/${id}/sync`,{method:'POST'});await load();route('Instances')}async function restartInstance(id,name){if(!await confirmDialog(`Restart ${name}? Home Assistant will be briefly unavailable.`,'Restart instance'))return;try{notify('Restart requested…');await api(`/api/instances/${id}/restart`,{method:'POST'});notify('Restart requested','ok');await load();route('Instances')}catch(e){notify(e.message,'err')}}async function backupOne(id){if(!await confirmDialog('Create Home Assistant backup for this instance now?','Confirm backup'))return;try{notify('Backup started…');let j=await api(`/api/instances/${id}/backup`,{method:'POST'});notify(`Backup ${j.status}${j.backup_id?`: ${j.backup_id}`:''}`,j.status==='completed'?'ok':'err');await load();route('Recent activity')}catch(e){notify(e.message,'err')}}async function deleteInstance(id,name){if(!await confirmDialog(`Delete ${name}? This removes it from Fleet Manager only.`,'Delete instance'))return;try{await api(`/api/instances/${id}`,{method:'DELETE'});notify('Instance deleted.','ok');await load();route('Instances')}catch(e){notify(e.message,'err')}}async function ackNotification(id){await api(`/api/notifications/${id}/ack`,{method:'POST'});await load();route('Recent activity')}async function ackAllNotifications(){let open=(data.notifications||[]).filter(n=>n.status==='open').length;if(!open)return notify('No open notifications','ok');if(!await confirmDialog(`Acknowledge ${open} open notifications?`,'Acknowledge all'))return;let j=await api('/api/notifications/ack',{method:'POST',body:{ids:[]}});notify(`Acknowledged ${j.count} notifications`,'ok');await load();route('Recent activity')}
function instanceForm(i){let env=i?.environment||'Production';let opts=['Production','Secondary','Lab','Test','Household','Rental','Remote'].map(x=>`<option ${x===env?'selected':''}>${x}</option>`).join('');return `<div class="settingsGrid"><div><label>Friendly name</label><input id="afn" value="${esc(i?.friendly_name||'')}"></div><div><label>URL</label><input id="aurl" placeholder="https://ha.example" value="${esc(i?.url||'')}"></div><div><label>Environment</label><select id="aenv">${opts}</select></div><div><label>Location</label><input id="aloc" value="${esc(i?.location||'')}"></div><div><label>Tags</label><input id="atags" placeholder="comma separated" value="${esc((i?.tags||[]).join(', '))}"></div><div><label>Long-lived token</label><input id="atok" type="password" placeholder="${i?'Leave blank to keep existing token':''}"></div></div>`}
function openAddInstance(){drawer.classList.add('open');drawer.innerHTML=`<button onclick="drawer.classList.remove('open')">Close</button><h2>Add Instance</h2>${instanceForm(null)}<p><button class="primary" onclick="addInstance()">Test and save</button></p><div id="addErr" class="err"></div>`}
function openEditInstance(id){let i=instanceById(id);drawer.classList.add('open');drawer.innerHTML=`<button onclick="drawer.classList.remove('open')">Close</button><h2>Edit Instance</h2><p>${instanceStatus(i)}${statusInfo(i)} <span class="muted">Last check: ${esc(i?.last_update_scan||'—')}</span></p>${instanceForm(i)}<p><button class="primary" onclick="saveInstance(${id})">Test and save</button></p><div id="addErr" class="err"></div>`}
function instancePayload(includeBlankToken=false){let body={friendly_name:afn.value,url:aurl.value,environment:aenv.value,location:aloc.value,tags:atags.value.split(',').map(x=>x.trim()).filter(Boolean)};if(includeBlankToken||atok.value.trim())body.token=atok.value.trim();return body}
async function addInstance(){try{await api('/api/instances',{method:'POST',body:instancePayload(true)});drawer.classList.remove('open');await load();route(activePage==='Settings'?'Settings':'Instances')}catch(e){addErr.textContent=e.message}}
async function saveInstance(id){try{await api(`/api/instances/${id}`,{method:'PATCH',body:instancePayload(false)});drawer.classList.remove('open');notify('Instance updated.','ok');await load();route(activePage==='Settings'?'Settings':'Instances')}catch(e){addErr.textContent=e.message}}
boot();
</script>
</body>
