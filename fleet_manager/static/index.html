<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Home Assistant Fleet Manager</title><style>
:root{--bg:#f6f7f9;--panel:#fff;--line:#d9dee7;--text:#17202a;--muted:#667085;--nav:#101828;--blue:#155eef;--red:#b42318;--amber:#b54708;--green:#067647}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}nav{background:var(--nav);color:#d0d5dd;padding:14px 10px;position:sticky;top:0;height:100vh}.brand{font-weight:700;color:#fff;padding:9px 10px 16px;border-bottom:1px solid #344054;margin-bottom:10px}.nav a{display:block;color:#d0d5dd;text-decoration:none;padding:8px 10px;border-radius:4px;margin:2px 0}.nav a.active,.nav a:hover{background:#1d2939;color:#fff}main{padding:18px 22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 10px}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:14px}.panel-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panel-b{padding:12px}.strip{display:flex;gap:8px;flex-wrap:wrap}.metric{border:1px solid var(--line);background:#fff;padding:7px 10px;min-width:92px}.metric b{font-size:18px;display:block}.toolbar{display:flex;gap:8px;align-items:center}button,.btn{border:1px solid #bfc7d3;background:#fff;border-radius:4px;padding:6px 9px;cursor:pointer;color:#1d2939}button.primary{background:var(--blue);border-color:var(--blue);color:white}button.danger{color:var(--red)}input,select{border:1px solid #bfc7d3;border-radius:4px;padding:6px 8px;background:#fff}table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#f8fafc;letter-spacing:.03em}tr:hover td{background:#fbfcfe}.pill{display:inline-block;padding:2px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line);background:#fff}.healthy,.low{color:var(--green)}.warning,.high{color:var(--amber)}.critical,.offline{color:var(--red)}.drawer{position:fixed;right:0;top:0;width:min(560px,100%);height:100%;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 24px #0002;padding:16px;overflow:auto;display:none}.drawer.open{display:block}.login{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hide{display:none}.err{color:var(--red);white-space:pre-wrap}.ok{color:var(--green)}.focus:focus,button:focus,input:focus,select:focus{outline:2px solid #84adff;outline-offset:1px}@media(max-width:800px){.app{grid-template-columns:1fr}nav{height:auto;position:relative}.grid{grid-template-columns:1fr}}
</style></head><body><div id="login" class="login hide"><h1>Home Assistant Fleet Manager</h1><p class="muted">Sign in to the control plane.</p><div class="grid"><input id="email" value="admin@example.local" aria-label="email"><input id="password" type="password" placeholder="Password" aria-label="password"></div><p><button class="primary" onclick="login()">Sign in</button></p><div id="loginErr" class="err"></div></div><div id="app" class="app hide"><nav><div class="brand">HA Fleet Manager</div><div class="nav" id="nav"></div></nav><main><div class="top"><div><h1 id="title">Dashboard</h1><div class="muted">Operational control plane for Home Assistant maintenance</div></div><div class="toolbar"><button onclick="syncAll()">Refresh fleet</button><button onclick="logout()">Logout</button></div></div><section id="content"></section></main></div><div id="drawer" class="drawer"></div><script>
let csrf=null, data={instances:[],updates:[],dashboard:null,audit:[],deployments:[]};const pages=['Dashboard','Instances','Updates','Deployments','Approvals','Backups','Schedules','Operations','Policies','Notifications','Audit Log','Settings'];
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}async function api(p,o={}){o.headers=o.headers||{};if(csrf)o.headers['x-csrf-token']=csrf;if(o.body&&typeof o.body!=='string'){o.headers['content-type']='application/json';o.body=JSON.stringify(o.body)}let r=await fetch(p,o);if(r.status===401){showLogin();throw new Error('auth')}let j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.statusText);return j}
async function boot(){try{let s=await api('/api/session');csrf=s.csrf_token;showApp();await load();route('Dashboard')}catch(e){showLogin()}}function showLogin(){document.getElementById('login').classList.remove('hide');document.getElementById('app').classList.add('hide')}function showApp(){document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');document.getElementById('nav').innerHTML=pages.map(p=>`<a href="#" onclick="route('${p}');return false" id="nav-${p}">${p}</a>`).join('')}
async function login(){try{let j=await api('/api/auth/login',{method:'POST',body:{email:email.value,password:password.value}});csrf=j.csrf_token;showApp();await load();route('Dashboard')}catch(e){loginErr.textContent=e.message}}async function logout(){await api('/api/auth/logout',{method:'POST'});showLogin()}async function load(){data.dashboard=await api('/api/dashboard');data.instances=await api('/api/instances');data.updates=await api('/api/updates');data.deployments=await api('/api/deployments').catch(()=>[]);data.audit=await api('/api/audit').catch(()=>[])}
function setPage(p){title.textContent=p;pages.forEach(x=>document.getElementById('nav-'+x)?.classList.toggle('active',x===p))}function metric(k,v){return `<div class="metric"><span class="muted">${k}</span><b>${v}</b></div>`}function route(p){setPage(p); if(p==='Dashboard')dash(); else if(p==='Instances')instances(); else if(p==='Updates')updates(); else if(p==='Deployments')deployments(); else if(p==='Audit Log')audit(); else placeholder(p)}
function dash(){let t=data.dashboard.totals;content.innerHTML=`<div class="strip">${metric('Instances',t.instances)}${metric('Healthy',t.healthy)}${metric('Warning',t.warning)}${metric('Critical',t.critical)}${metric('Offline',t.offline)}${metric('Updates',t.updates_available)}${metric('Approvals',t.pending_approvals)}${metric('Failed jobs',t.failed_jobs)}</div><div class="panel"><div class="panel-h"><h2>Needs attention</h2></div><div class="panel-b">${updateTable(data.dashboard.needs_attention||[])}</div></div><div class="panel"><div class="panel-h"><h2>Fleet instances</h2></div><div class="panel-b">${instanceTable(data.instances)}</div></div>`}
function instanceTable(rows){return `<table><thead><tr><th>Instance</th><th>Status</th><th>Env</th><th>HA Version</th><th>Updates</th><th>Critical</th><th>Approval</th><th>Last Backup</th><th>Last Check</th><th>Next Maintenance</th><th>Actions</th></tr></thead><tbody>${rows.map(i=>`<tr><td><b>${esc(i.friendly_name)}</b><br><span class="muted">${esc(i.location||'')}</span></td><td class="${i.health_state}">${esc(i.health_state)}</td><td>${esc(i.environment)}</td><td>${esc(i.ha_core_version||'—')}</td><td>${i.available_updates}</td><td>${i.critical_updates}</td><td>${i.pending_approvals}</td><td>${esc(i.last_successful_backup||'—')}</td><td>${esc(i.last_update_scan||'—')}</td><td>${esc(i.maintenance_window||'—')}</td><td><button onclick="syncOne(${i.id})">Sync</button></td></tr>`).join('')}</tbody></table>`}
function instances(){content.innerHTML=`<div class="panel"><div class="panel-h"><h2>Instances</h2><button class="primary" onclick="openAddInstance()">Add Home Assistant</button></div><div class="panel-b">${instanceTable(data.instances)}</div></div>`}function updateTable(rows){return `<table><thead><tr><th><input type="checkbox"></th><th>Instance</th><th>Component</th><th>Current</th><th>Available</th><th>Risk</th><th>Critical</th><th>Breaking</th><th>Approval</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(u=>`<tr><td><input class="upd" value="${u.id}" type="checkbox"></td><td>${esc(u.instance||'')}</td><td><b>${esc(u.component)}</b><br><span class="muted">${esc(u.category)} · ${esc(u.entity_id)}</span></td><td>${esc(u.installed_version||'—')}</td><td>${esc(u.available_version||'—')}</td><td class="${u.risk_level}">${esc(u.risk_level)}</td><td>${u.critical_state?'Yes':'No'}</td><td>${u.breaking_state?'Yes':'No'}</td><td>${esc(u.approval_state)}</td><td>${esc(u.installation_state)}</td><td><button onclick='detail(${JSON.stringify(u.id)})'>Review</button></td></tr>`).join('')}</tbody></table>`}
function updates(){content.innerHTML=`<div class="panel"><div class="panel-h"><h2>Unified Update Center</h2><button onclick="planFromSelection()">Create deployment plan</button></div><div class="panel-b">${updateTable(data.updates)}</div></div>`}function deployments(){content.innerHTML=`<div class="panel"><div class="panel-h"><h2>Deployment Plans</h2></div><div class="panel-b"><table><thead><tr><th>Plan</th><th>Status</th><th>Updates</th><th>Instances</th><th>Blockers</th><th>Created</th></tr></thead><tbody>${data.deployments.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.status)}</td><td>${p.summary.updates}</td><td>${p.summary.instances}</td><td>${(p.summary.blockers||[]).map(esc).join('<br>')||'—'}</td><td>${esc(p.created_at)}</td></tr>`).join('')}</tbody></table></div></div>`}function audit(){content.innerHTML=`<div class="panel"><div class="panel-h"><h2>Audit Log</h2></div><div class="panel-b"><table><thead><tr><th>Time</th><th>Action</th><th>Resource</th><th>Result</th></tr></thead><tbody>${data.audit.map(a=>`<tr><td>${esc(a.timestamp)}</td><td>${esc(a.action)}</td><td>${esc(a.resource_type)} ${esc(a.resource_id||'')}</td><td>${esc(a.result)}</td></tr>`).join('')}</tbody></table></div></div>`}function placeholder(p){content.innerHTML=`<div class="panel"><div class="panel-h"><h2>${p}</h2></div><div class="panel-b muted">Planned Phase 2+ area. Domain model and API boundaries are present where applicable.</div></div>`}
function detail(id){let u=data.updates.find(x=>x.id===id);drawer.classList.add('open');drawer.innerHTML=`<button onclick="drawer.classList.remove('open')">Close</button><h2>${esc(u.component)}</h2><p><b>${esc(u.installed_version)}</b> → <b>${esc(u.available_version)}</b></p><table><tr><th>Risk</th><td>${esc(u.risk_level)}</td></tr><tr><th>Critical</th><td>${u.critical_state}</td></tr><tr><th>Breaking</th><td>${u.breaking_state}</td></tr><tr><th>Approval</th><td>${esc(u.approval_state)}</td></tr><tr><th>Restart</th><td>${u.restart_required}</td></tr></table><h3>Policy explanation</h3><p>${esc(u.policy_explanation)}</p><h3>Breaking / action-required</h3><pre>${esc(u.breaking_excerpt||'None detected deterministically')}</pre><h3>Release notes</h3><pre>${esc(u.release_notes||'No release notes captured. Use release URL when available.')}</pre>${u.release_url?`<p><a href="${esc(u.release_url)}" target="_blank" rel="noopener">Open external release URL</a></p>`:''}`}
async function syncAll(){await api('/api/sync-all',{method:'POST'});await load();route(title.textContent)}async function syncOne(id){await api(`/api/instances/${id}/sync`,{method:'POST'});await load();route('Instances')}function openAddInstance(){drawer.classList.add('open');drawer.innerHTML=`<button onclick="drawer.classList.remove('open')">Close</button><h2>Add Home Assistant</h2><div class="grid"><input id="afn" placeholder="Friendly name"><input id="aurl" placeholder="https://ha.example"><select id="aenv"><option>Production</option><option>Secondary</option><option>Lab</option><option>Test</option><option>Family</option><option>Rental</option><option>Remote</option></select><input id="aloc" placeholder="Location"><input id="atags" placeholder="tags comma separated"><input id="atok" type="password" placeholder="Long-lived access token"></div><p><button class="primary" onclick="addInstance()">Test and save</button></p><div id="addErr" class="err"></div>`}async function addInstance(){try{await api('/api/instances',{method:'POST',body:{friendly_name:afn.value,url:aurl.value,token:atok.value,environment:aenv.value,location:aloc.value,tags:atags.value.split(',').map(s=>s.trim()).filter(Boolean)}});drawer.classList.remove('open');await load();route('Instances')}catch(e){addErr.textContent=e.message}}
async function planFromSelection(){let ids=[...document.querySelectorAll('.upd:checked')].map(x=>Number(x.value));if(!ids.length)return alert('Select updates first');await api('/api/deployments',{method:'POST',body:{name:'Manual deployment plan',update_ids:ids}});await load();route('Deployments')}boot();
</script></body></html>
