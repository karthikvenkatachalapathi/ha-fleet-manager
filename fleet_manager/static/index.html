      body.appMode nav{position:fixed!important;left:0!important;right:0!important;top:auto!important;bottom:0!important;width:100vw!important;height:calc(64px + env(safe-area-inset-bottom))!important;max-height:calc(64px + env(safe-area-inset-bottom))!important;z-index:2147483000!important;display:grid!important;grid-template-columns:1fr!important;padding:0 0 env(safe-area-inset-bottom)!important;margin:0!important;border-right:0!important;border-top:1px solid rgba(255,255,255,.14)!important;background:var(--nav)!important;box-shadow:0 -12px 30px rgba(0,0,0,.38)!important;transform:translate3d(0,0,0)!important}
      body.appMode .nav{height:64px!important;width:100%!important;display:grid!important;grid-auto-flow:column!important;grid-auto-columns:1fr!important;align-items:stretch!important;overflow:hidden!important;background:var(--nav)!important}
      body.appMode .nav a{height:64px!important;min-height:64px!important;align-self:stretch!important;display:grid!important;place-items:center!important}
    }

<body>
  <button id="loginThemeBtn" class="iconBtn loginTheme" onclick="toggleTheme()" aria-label="Toggle theme">☾</button>
  <div id="toast" class="toast hide"></div>
  <div id="login" class="login hide">
    <img class="loginLogo" src="/assets/ha-fleet-manager-icon-transparent.png" alt="Home Assistant Fleet Manager logo">
    <h1>Home Assistant Fleet Manager</h1>
    <p class="muted">Manage updates across trusted Home Assistant instances.</p>
    <label for="email">Email or username</label><input id="email" autocomplete="username">
    <label for="password">Password</label><input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <div class="loginActions"><button class="primary" onclick="login()">Sign in</button><a id="oidcLogin" class="ssoBtn hide" href="/api/auth/oidc/start">Sign in with SSO</a></div>
    <div id="loginErr" class="err"></div>
  </div>
  <div id="app" class="app hide">
    <nav><div class="brand" onclick="route('Updates')" title="Home"><img class="brandLogo" src="/assets/ha-fleet-manager-icon-transparent.png" alt=""><div class="brandName">Home Assistant<br>Fleet Manager</div><button class="navToggle" onclick="event.stopPropagation();toggleNav()" title="Expand/collapse">☰</button></div><div class="nav" id="nav"></div></nav>
    <main class="page"><div class="top"><div class="mobileBrand" onclick="route('Updates')" role="button" tabindex="0" title="Home" aria-label="Home"><img class="mobileTopLogo" src="/assets/ha-fleet-manager-icon-transparent.png" alt=""><div class="mobileAppName">Home Assistant<br>Fleet Manager</div></div><div class="topTitle"><h1 id="title">Updates</h1><div class="muted" id="subtitle">Select updates, review release notes if needed, then update or skip.</div></div><div class="topActions"><button class="iconBtn refreshBtn" onclick="syncAll()" title="Refresh fleet status" aria-label="Refresh fleet status"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 12a7.5 7.5 0 0 1 12.8-5.3"/><path d="M17.3 3.9v3.4h-3.4"/><path d="M19.5 12a7.5 7.5 0 0 1-12.8 5.3"/><path d="M6.7 20.1v-3.4h3.4"/></svg></button><button id="themeBtn" class="iconBtn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">☾</button><button class="iconBtn logoutIcon" onclick="logout()" title="Logout" aria-label="Logout"><svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path class="door" d="M6 5.5c0-.9.6-1.8 1.5-2.1l7-2.8c1.4-.6 2.9.5 2.9 2.1v26.6c0 1.6-1.5 2.7-2.9 2.1l-7-2.8C6.6 28.3 6 27.4 6 26.5z"/><circle class="knob" cx="13.2" cy="16" r="1.6"/><path d="M19 8h5v7"/><path d="M19 24h5v-7"/><path d="M17.5 16h10"/><path d="M23.8 11.8 28 16l-4.2 4.2"/></svg></button></div></div><section id="content"></section></main>
  </div>
  <div id="drawer" class="drawer"></div>
  <div id="confirmOverlay" class="confirmOverlay hide"><div class="confirmBox"><h2 id="confirmTitle">Confirm</h2><p id="confirmText" class="muted"></p><div class="confirmActions"><button id="confirmCancel">Cancel</button><button id="confirmOk" class="primary">Confirm</button></div></div></div>
<script>
let csrf=null, data={instances:[],updates:[],repairs:[],dashboard:null,audit:[],operations:[],jobs:[],backups:[],notifications:[],policies:[],schedules:[],user:null,oidc:null,notificationSettings:null};
let activePage=null, liveTimer=null, settingsTab=localStorage.getItem('hafm-settings-tab')||'Account', repairsLoaded=false, repairsLoading=false;
const basePages=['Updates','Repairs','Recent activity','Settings'];
const pageIcons={Updates:'⇧',Repairs:'⚠',Instances:'⌂','Recent activity':'◷',Settings:'⚙'};
function pages(){return [...basePages]}
let updateSort={key:'risk',dir:'desc'}, instanceSort={key:'friendly_name',dir:'asc'};
const $=id=>document.getElementById(id);
function themeIcon(t){return t==='dark'?'<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.8A8.7 8.7 0 0 1 11.2 3a7.1 7.1 0 1 0 9.8 9.8z"></path></svg>'}
function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('hafm-theme',t);['themeBtn','loginThemeBtn'].forEach(id=>{let b=$(id);if(b)b.innerHTML=themeIcon(t)})}
function toggleTheme(){applyTheme((document.documentElement.dataset.theme||'light')==='dark'?'light':'dark')}
applyTheme(localStorage.getItem('hafm-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function api(p,o={}){o.headers=o.headers||{};if(csrf)o.headers['x-csrf-token']=csrf;o.headers['x-fleet-page']=activePage||title?.textContent||'unknown';o.headers['x-fleet-menu']=(activePage==='Settings'?settingsTab:activePage)||'unknown';if(o.body&&typeof o.body!=='string'){o.headers['content-type']='application/json';o.body=JSON.stringify(o.body)}let r=await fetch(p,o);if(r.status===401){showLogin();throw new Error('Authentication required')}let j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.statusText);return j}
function savedPage(){let p=localStorage.getItem('hafm-page')||location.hash.replace(/^#/,'');if(p==='Instances'){settingsTab='Instance config';return 'Settings'}return pages().includes(p)?p:'Updates'}
async function boot(){await loadOidcConfig();try{let s=await api('/api/session');csrf=s.csrf_token;data.user=s.user;showApp();let p=savedPage();activePage=p;setPage(p);await refreshInitialFleet();route(p)}catch(e){showLogin()}}
async function loadOidcConfig(){data.oidc=await fetch('/api/auth/oidc/config').then(r=>r.json()).catch(()=>({enabled:false}));let b=$('oidcLogin');if(b&&data.oidc?.enabled){b.textContent=data.oidc.button_label||'Sign in with SSO';b.classList.remove('hide')}}
function showLogin(){document.body.classList.remove('appMode');$('login').classList.remove('hide');$('app').classList.add('hide');$('loginThemeBtn')?.classList.remove('hide')}
function toggleNav(){let app=$('app');app.classList.toggle('expanded');localStorage.setItem('hafm-nav-expanded',app.classList.contains('expanded')?'1':'0')}
function navBadge(p){let n=p==='Repairs'?(data.repairs||[]).length:p==='Updates'?visibleUpdates().filter(updateIsPending).length:0;return n?` <b class="navBadge">${n}</b>`:''}
function renderNav(){$('nav').innerHTML=pages().map(p=>`<a href="#" onclick="route('${p}');return false" id="nav-${p}" title="${p}"><span class="navIcon">${pageIcons[p]}</span><span class="navLabel">${p}${navBadge(p)}</span></a>`).join('')}
function showApp(){document.body.classList.add('appMode');$('login').classList.add('hide');$('app').classList.remove('hide');$('loginThemeBtn')?.classList.add('hide');$('app').classList.toggle('expanded',localStorage.getItem('hafm-nav-expanded')==='1');renderNav()}
function notify(msg,kind='info'){let t=$('toast');t.textContent=msg;t.className='toast '+kind;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hide'),7000)}
function confirmDialog(text,title='Confirm'){return new Promise(resolve=>{confirmTitle.textContent=title;confirmText.textContent=text;confirmOverlay.classList.remove('hide');confirmCancel.onclick=()=>{confirmOverlay.classList.add('hide');resolve(false)};confirmOk.onclick=()=>{confirmOverlay.classList.add('hide');resolve(true)}})}
async function login(){try{loginErr.textContent='';let j=await api('/api/auth/login',{method:'POST',body:{email:email.value,password:password.value}});csrf=j.csrf_token;data.user=j.user;showApp();activePage='Updates';setPage('Updates');await refreshInitialFleet();route('Updates')}catch(e){loginErr.textContent=e.message}}
async function logout(){await api('/api/auth/logout',{method:'POST'});showLogin()}
async function load(){await loadCore()}
async function loadCore(){let [instances,updates]=await Promise.all([api('/api/instances'),api('/api/updates')]);data.instances=instances;data.updates=updates;renderNav?.()}
async function refreshInitialFleet(){content.innerHTML=loadingPanel('Refreshing updates across all instances…');let warning='';try{let result=await api('/api/sync-all',{method:'POST'});if(result.sync_failed)warning=`${result.sync_failed} instance refresh${result.sync_failed===1?'':'es'} failed`}catch(e){warning=e.message}await loadCore();if(warning)notify(`Fleet refresh incomplete: ${warning}`,'err')}
async function refreshRepairs(){if(repairsLoading)return;repairsLoading=true;try{data.repairs=await api('/api/repairs').catch(()=>[]);repairsLoaded=true}finally{repairsLoading=false}if(activePage==='Repairs'){repairs();renderNav?.()}}
async function refreshActivity(){let [audit,notifications,operations,jobs,backups]=await Promise.all([api('/api/audit').catch(()=>[]),api('/api/notifications').catch(()=>[]),api('/api/operations').catch(()=>[]),api('/api/jobs').catch(()=>[]),api('/api/backups').catch(()=>[])]);Object.assign(data,{audit,notifications,operations,jobs,backups});if(activePage==='Recent activity')history()}
async function refreshSettings(){let [user,oidc,policies,schedules,notificationSettings]=await Promise.all([api('/api/user/settings').catch(()=>data.user),api('/api/oidc/settings').catch(()=>data.oidc),api('/api/policies').catch(()=>[]),api('/api/schedules').catch(()=>[]),api('/api/notification-settings').catch(()=>data.notificationSettings)]);Object.assign(data,{user,oidc,policies,schedules,notificationSettings});if(activePage==='Settings')settings()}
function pageTitle(p){return p==='Updates'?'Fleet health':p}
function setPage(p){title.textContent=pageTitle(p);pages().forEach(x=>$('nav-'+x)?.classList.toggle('active',x===p));subtitle.textContent=p==='Updates'?'Fleet-wide update status. Select updates, review release notes if needed, then update or skip.':p==='Settings'?'Account and single sign-on configuration.':''}
function route(p){if(p==='Instances'){settingsTab='Instance config';p='Settings'}if(!pages().includes(p))p='Updates';activePage=p;localStorage.setItem('hafm-page',p);location.hash=p;drawer.classList.remove('open');setPage(p);if(p==='Updates')updates();else if(p==='Repairs'){repairs();if(!repairsLoaded)refreshRepairs();}else if(p==='Instances')instances();else if(p==='Recent activity'){history();refreshActivity()}else if(p==='Settings'){settings();refreshSettings()}manageLivePolling()}
function openInstanceConfig(){settingsTab='Instance config';localStorage.setItem('hafm-settings-tab',settingsTab);route('Settings')}
function setUpdateFilter(kind,value){if(activePage!=='Updates')route('Updates');setTimeout(()=>{if(kind==='status'&&$('fStatus'))$('fStatus').value=value;if(kind==='risk'&&$('fRisk')){$('fRisk').value=value;window.hafmHighRiskOnly=value==='high'}else if(kind==='status')window.hafmHighRiskOnly=false;renderUpdateRows?.();},0)}
function metric(k,v,action=''){let attrs=action?` role="button" tabindex="0" onclick="${action}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${action}}"`:'';return `<div class="metric${action?' clickable':''}"${attrs}><span class="muted">${k}</span><b>${v}</b></div>`}
function sameVersion(u){return u.installed_version&&u.available_version&&u.installed_version===u.available_version}
function updateIsVisible(u){return u.in_progress||!sameVersion(u)}
function updateIsPending(u){return u.in_progress||(u.installation_state==='available'&&u.skip_state!=='skipped')}
function sortVal(o,k){if(k==='version')return `${o.installed_version||''} ${o.available_version||''}`;if(k==='update')return o.component||'';if(k==='updates')return Number(o.available_updates||0);return o[k]??''}
function cmp(a,b,k){let av=sortVal(a,k),bv=sortVal(b,k);if(typeof av==='number'||typeof bv==='number')return Number(av)-Number(bv);return String(av).localeCompare(String(bv),undefined,{numeric:true,sensitivity:'base'})}
function sortRows(rows,state){return [...rows].sort((a,b)=>(state.dir==='asc'?1:-1)*cmp(a,b,state.key))}
function setSort(scope,key){let st=scope==='updates'?updateSort:instanceSort;if(st.key===key)st.dir=st.dir==='asc'?'desc':'asc';else{st.key=key;st.dir='asc'};scope==='updates'?renderUpdateRows():renderInstancesTable()}
function th(scope,key,label){let st=scope==='updates'?updateSort:instanceSort;let mark=st.key===key?(st.dir==='asc'?'▲':'▼'):'';return `<th class="sortHead" onclick="setSort('${scope}','${key}')">${label}<span class="sortMark">${mark}</span></th>`}
function visibleUpdates(){let rows=data.updates.filter(updateIsVisible);let q=($('fSearch')?.value||'').toLowerCase(), inst=$('fInstance')?.value||'', cat=$('fCategory')?.value||'', risk=$('fRisk')?.value||'', status=$('fStatus')?.value||'available';return rows.filter(u=>(!q||`${u.component} ${u.entity_id} ${u.instance}`.toLowerCase().includes(q))&&(!inst||String(u.instance_id)===inst)&&(!cat||u.category===cat)&&(!risk||(window.hafmHighRiskOnly?['high','critical'].includes(u.risk_level):u.risk_level===risk))&&(status==='all'||(status==='available'?updateIsPending(u):status==='skipped'?u.skip_state==='skipped':u.installation_state===status)))}
function updateMetrics(){let rows=data.updates.filter(updateIsVisible), pending=rows.filter(updateIsPending);return `<div class="strip">${metric('Pending',pending.length,"setUpdateFilter('status','available')")}${metric('Instances',data.instances.length,"openInstanceConfig()")}${metric('High risk',pending.filter(u=>['high','critical'].includes(u.risk_level)).length,"setUpdateFilter('risk','high')")}${metric('Skipped',rows.filter(u=>u.skip_state==='skipped').length,"setUpdateFilter('status','skipped')")}</div>`}
function updates(){let rows=data.updates.filter(updateIsVisible), cats=[...new Set(rows.map(u=>u.category).filter(Boolean))].sort(), risks=[...new Set(rows.map(u=>u.risk_level).filter(Boolean))].sort();content.innerHTML=`${updateMetrics()}<div class="panel"><div class="panel-h"><h2>Available updates</h2><div class="toolbar"><button class="bulkButton danger" onclick="bulkAction('skip')" title="Skip selected" aria-label="Skip selected">⊘ <span>Skip selected</span></button><button class="bulkButton primary" onclick="bulkAction('update')" title="Update selected" aria-label="Update selected">⇧ <span>Update selected</span></button></div></div><div class="panel-b"><div class="filters"><input id="fSearch" placeholder="Search update" oninput="renderUpdateRows()"><select id="fInstance" onchange="renderUpdateRows()"><option value="">All instances</option>${data.instances.map(i=>`<option value="${i.id}">${esc(i.friendly_name)}</option>`).join('')}</select><select id="fCategory" onchange="renderUpdateRows()"><option value="">All types</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><select id="fRisk" onchange="renderUpdateRows()"><option value="">All risk levels</option>${risks.map(r=>`<option>${esc(r)}</option>`).join('')}</select><select id="fStatus" onchange="renderUpdateRows()"><option value="available">Pending only</option><option value="skipped">Skipped</option><option value="installed">Updated</option><option value="all">All statuses</option></select></div><div class="actionsBar"><span id="selCount" class="muted">0 selected</span></div><div id="updatesTable"></div></div></div>`;renderUpdateRows()}
function rowStatus(u){if(u.in_progress)return 'installing';if(u.skip_state==='skipped')return 'skipped';if(u.installation_state==='installed')return 'verified updated';return esc(u.installation_state)}
function progressWidget(u){if(!u.in_progress)return '<span class="muted">—</span>';return `<div class="progressCell"><div class="progressText">installing</div><div class="progressBar"><div class="progressFill indeterminate"></div></div></div>`}
function updateActionButton(u){if(u.skip_state==='skipped')return '<button class="iconAction primary" disabled title="Skipped — re-enable in Home Assistant first" aria-label="Skipped">⇧</button>';return `<button class="iconAction primary" onclick="installUpdate(${u.id})" title="Update" aria-label="Update">⇧</button>`}
function renderUpdateRows(){let rows=sortRows(visibleUpdates(),updateSort);$('updatesTable').innerHTML=`<table><thead><tr><th><input id="selectAll" type="checkbox" onchange="toggleAll(this.checked)"></th>${th('updates','instance','Instance')}${th('updates','update','Update')}${th('updates','category','Type')}${th('updates','version','Current → Available')}<th>Progress</th><th>Actions</th></tr></thead><tbody>${rows.map(u=>`<tr><td class="selectCell" data-label=""><input class="upd" value="${u.id}" type="checkbox" onchange="countSelected()"></td><td data-label="Instance"><a href="#" onclick="openHaInstance(${u.instance_id});return false">${esc(u.instance||'')}</a></td><td data-label="Update"><b>${esc(u.component)}</b><br><span class="muted">${esc(u.entity_id)}</span></td><td data-label="Type">${esc(u.category)}</td><td data-label="Version">${esc(u.installed_version||'—')} → <b>${esc(u.available_version||'—')}</b></td><td data-label="Progress">${progressWidget(u)}</td><td class="actionsCell" data-label="Actions"><div class="rowActions"><button class="iconAction" onclick="detail(${u.id})" title="Open details" aria-label="Open details">⌕</button>${updateActionButton(u)}<button class="iconAction danger" onclick="skipOne(${u.id})" title="Skip" aria-label="Skip">⊘</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="muted">No matching updates.</td></tr>'}</tbody></table>`;countSelected()}
function manageLivePolling(){let any=(data.updates||[]).some(u=>u.in_progress);if(liveTimer){clearInterval(liveTimer);liveTimer=null}if(activePage==='Updates'&&any)liveTimer=setInterval(async()=>{try{await load();if(activePage==='Updates'){updates();notify('Update progress refreshed','info')}}catch(e){}},5000)}
function toggleAll(checked){document.querySelectorAll('.upd').forEach(x=>x.checked=checked);countSelected()}function selectedIds(){return [...document.querySelectorAll('.upd:checked')].map(x=>Number(x.value))}function countSelected(){let n=selectedIds().length;if($('selCount'))$('selCount').textContent=`${n} selected`}
async function bulkAction(action, ids=null){ids=ids||selectedIds();if(!ids.length)return notify('Select updates first','err');let verb={update:'update selected updates',skip:'skip selected updates'}[action];if(!await confirmDialog(verb,'Confirm action'))return;try{notify(`${verb} started…`);let j=await api('/api/updates/bulk',{method:'POST',body:{action,update_ids:ids}});notify(summaryText(j),j.failed?.length?'err':'ok');setTimeout(async()=>{await load();route('Updates')},800)}catch(e){notify(e.message,'err')}}
function summaryText(j){let failed=j.failed?.length||0,blocked=j.blocked?.length||0;if(failed)return `${j.action}: ${failed} failed`;if(blocked)return `${j.action}: ${blocked} blocked`;if(j.action_required)return `Installed ${j.action_required}; restart required`;if(j.updated)return `Verified updated ${j.updated} update${j.updated===1?'':'s'}`;if(j.skipped)return `Skipped ${j.skipped} update${j.skipped===1?'':'s'}`;if(j.reviewed)return `Reviewed ${j.reviewed} update${j.reviewed===1?'':'s'}`;return `${j.action}: done`}
function plainReason(r){return String(r||'').replaceAll('_',' ').replaceAll(':',': ')}
function instanceById(id){return data.instances.find(i=>Number(i.id)===Number(id))}
function openHaInstance(id){let i=instanceById(id);if(!i||!i.url)return notify('Home Assistant URL not configured','err');window.open(i.url,'_blank','noopener')}
function openHaEntity(instanceId,entityId){let i=instanceById(instanceId);if(!i||!i.url)return notify('Home Assistant URL not configured','err');window.open(i.url.replace(/\/$/,'')+'/config/entities/entity/'+encodeURIComponent(entityId),'_blank','noopener')}
function openHaRepairs(id){let i=instanceById(id);if(!i||!i.url)return notify('Home Assistant URL not configured','err');window.open(i.url.replace(/\/$/,'')+'/config/repairs','_blank','noopener')}
function instanceIssue(i){let conn=i.connectivity_state||'unknown', health=i.health_state||'unknown';if(conn==='restarting')return 'Restart requested — waiting for Home Assistant to come back online';if(conn==='auth_failed')return 'Token invalid — edit instance and replace token';if(conn==='offline')return 'Cannot reach HA — check URL, network, tunnel, or HA service';if(health==='warning'&&(i.critical_updates||0)>0)return `${i.critical_updates} high-risk update${i.critical_updates===1?'':'s'} pending — review Updates`;if((i.available_updates||0)>0)return `${i.available_updates} update${i.available_updates===1?'':'s'} pending`;if(conn==='online'&&health==='healthy')return 'No action needed';return 'Refresh fleet status to re-check';}
function statusClass(i){let conn=i.connectivity_state||'unknown', health=i.health_state||'unknown';if(conn==='restarting')return 'warning';if(conn==='auth_failed')return 'auth_failed';if(conn==='offline')return 'offline';if(health==='healthy')return 'healthy';if(health==='warning')return 'warning';if(health==='degraded')return 'degraded';if(health==='critical')return 'critical';if(health==='ssl_expiring')return 'ssl_expiring';return 'unknown'}
function instanceStatus(i){let conn=i.connectivity_state||'unknown', health=i.health_state||'unknown';let label=conn==='online'?(health==='healthy'?'online':`${conn} / ${health}`):conn;return `<span class="statusPill ${esc(statusClass(i))}" title="${esc(instanceIssue(i))}">${esc(label)}</span>`}
function statusInfo(i){return `<span class="statusInfo ${esc(statusClass(i))}" title="${esc(instanceIssue(i))}" aria-label="${esc(instanceIssue(i))}">i</span>`}
async function skipOne(id){return bulkAction('skip',[id])}
function snapHtml(label,s){s=s||{};return `<div class="resultBox"><b>${esc(label)}</b><div>State: ${esc(s.state||'—')}</div><div>Installed: ${esc(s.installed_version||'—')}</div><div>Latest: ${esc(s.latest_version||'—')}</div><div>In progress: ${esc(String(s.in_progress??'—'))}</div></div>`}
function actionResultHtml(j,u){let d=j.details||{},err=d.post_exception?.message||'',attempts=(d.install_attempts||[]).length||1,kind=j.ok?'ok':'err',title=j.status==='succeeded'?'Verified updated':j.status==='accepted'?'Verification pending':j.status==='action_required'?'Updated — action required':'Update failed';return `<div class="resultPanel ${kind}"><h3>${esc(title)}</h3><p><b>${esc(j.state||j.status)}</b></p><div class="resultGrid">${snapHtml('Before',d.before)}${snapHtml('After',d.after)}</div><p class="muted">Install attempts: ${attempts}. Backup requested: ${d.backup_requested?'yes':'no'}.</p>${err?`<div class="errorBlock"><b>Home Assistant error</b><br>${esc(err)}</div>`:''}<p><button onclick="openHaEntity(${u.instance_id},'${esc(u.entity_id).replace(/'/g,'&#39;')}')">Open update in Home Assistant</button> <button onclick="openHaInstance(${u.instance_id})">Open instance</button></p></div>`}
async function installUpdate(id){let u=data.updates.find(x=>x.id===id);if(!u)return;if(u.skip_state==='skipped')return notify('Skipped update — re-enable in HA first','err');if(!await confirmDialog(`Install ${u.component} ${u.available_version||''} now?`,'Confirm update'))return;u.in_progress=true;u.progress=null;renderUpdateRows();manageLivePolling();try{notify('Update started — verifying against Home Assistant…');let j=await api(`/api/updates/${id}/install`,{method:'POST'});notify(j.status==='succeeded'?'Verified updated':j.status==='action_required'?`${j.state} — restart needed`:j.status==='accepted'?`${j.state} — still verifying`:`${j.state} — manual check needed`,j.status==='action_required'||j.status==='accepted'?'info':(j.ok?'ok':'err'));drawer.classList.add('open');drawer.innerHTML=`<button onclick="drawer.classList.remove('open')">Close</button><h2>${esc(u.component)}</h2>${actionResultHtml(j,u)}`;setTimeout(async()=>{await load();if(j.status==='action_required')await refreshRepairs();route('Updates')},1000)}catch(e){u.in_progress=false;renderUpdateRows();notify(e.message,'err')}}
function instanceTable(rows){rows=sortRows(rows,instanceSort);return `<table><thead><tr>${th('instances','friendly_name','Instance')}${th('instances','connectivity_state','Status')}${th('instances','environment','Environment')}${th('instances','ha_core_version','HA version')}${th('instances','updates','Updates')}${th('instances','last_update_scan','Last check')}<th>Actions</th></tr></thead><tbody>${rows.map(i=>`<tr><td data-label="Instance"><b><a href="#" onclick="openHaInstance(${i.id});return false">${esc(i.friendly_name)}</a></b><br><span class="muted">${esc(i.location||i.url||'')}</span></td><td data-label="Status">${instanceStatus(i)}${statusInfo(i)}</td><td data-label="Environment">${esc(i.environment)}</td><td data-label="HA version">${esc(i.ha_core_version||'—')}</td><td data-label="Updates">${i.available_updates}</td><td data-label="Last check">${esc(i.last_update_scan||'—')}</td><td class="actionsCell" data-label="Actions"><div class="rowActions"><button class="iconAction" onclick="backupOne(${i.id})" title="Backup" aria-label="Backup">⛁</button><button class="iconAction warning" onclick="restartInstance(${i.id},'${esc(i.friendly_name).replace(/'/g,'&#39;')}')" title="Restart Home Assistant" aria-label="Restart Home Assistant">⏻</button><button class="iconAction" onclick="openEditInstance(${i.id})" title="Edit" aria-label="Edit">✎</button><button class="iconAction danger" onclick="deleteInstance(${i.id},'${esc(i.friendly_name).replace(/'/g,'&#39;')}')" title="Delete" aria-label="Delete">⌫</button></div></td></tr>`).join('')}</tbody></table>`}
function renderInstancesTable(){let el=$('instancesTable');if(el)el.innerHTML=instanceTable(data.instances)}
function instances(){content.innerHTML=`<div class="strip">${metric('Instances',data.instances.length)}${metric('Online',data.instances.filter(i=>i.connectivity_state==='online').length)}${metric('Offline',data.instances.filter(i=>i.connectivity_state!=='online').length)}${metric('Updates',data.instances.reduce((n,i)=>n+(i.available_updates||0),0))}</div><div class="panel"><div class="panel-h"><h2>Instances</h2><button class="primary" onclick="openAddInstance()">Add Instance</button></div><div class="panel-b" id="instancesTable">${instanceTable(data.instances)}</div></div>`}
function loadingPanel(label='Loading…'){return `<div class="skeleton" aria-busy="true"><div class="skeletonLine short"></div><div class="skeletonLine mid"></div><div class="skeletonLine"></div><p class="muted">${esc(label)}</p></div>`}
function repairs(){if(!repairsLoaded){content.innerHTML=loadingPanel('Loading repairs…');refreshRepairs();return}let rows=data.repairs||[];content.innerHTML=`<div class="strip">${metric('Repairs',rows.length)}${metric('Instances',new Set(rows.map(r=>r.instance_id)).size)}${metric('Fixable',rows.filter(r=>r.is_fixable).length)}${metric('Warnings',rows.filter(r=>r.severity==='warning').length)}</div><div class="panel"><div class="panel-h"><h2>Repairs</h2><button onclick="load().then(()=>repairs())">Refresh</button></div><div class="panel-b">${repairTable(rows)}</div></div>`}
function repairActionLabel(r){return r.action==='host_reboot'?'Reboot':r.action==='ha_restart'?'Restart':'Fix'}
function repairAction(r){if(r.action)return `<button class="primary" onclick="fixRepair(${r.instance_id},'${esc(r.domain).replace(/'/g,'&#39;')}','${esc(r.issue_id).replace(/'/g,'&#39;')}','${esc(r.action).replace(/'/g,'&#39;')}','${esc(repairActionLabel(r)).replace(/'/g,'&#39;')}')">${esc(repairActionLabel(r))}</button>`;if(r.learn_more_url)return `<a href="${esc(r.learn_more_url)}" target="_blank" rel="noopener">Learn more</a>`;return `<a href="#" onclick="openHaRepairs(${r.instance_id});return false">Open Repairs</a>`}
async function fixRepair(instanceId,domain,issueId,action,label){if(!await confirmDialog(`${label} repair now? Home Assistant may restart or reboot if that is the repair action.`,'Run repair'))return;try{notify(`${label} requested…`);await api('/api/repairs/fix',{method:'POST',body:{instance_id:instanceId,domain,issue_id:issueId,action}});notify(`${label} requested — instance marked restarting`,'ok');await load();route('Repairs');setTimeout(async()=>{try{await load();route(activePage||'Repairs')}catch(e){}},12000)}catch(e){notify(e.message,'err')}}
function repairTable(rows){return `<table><thead><tr><th>Instance</th><th>Severity</th><th>Issue</th><th>Domain</th><th>Action</th></tr></thead><tbody>${rows.map(r=>`<tr><td><a href="#" onclick="openHaInstance(${r.instance_id});return false">${esc(r.instance)}</a></td><td><span class="statusPill ${esc(r.severity==='error'?'critical':r.severity)}">${esc(r.severity)}</span></td><td><b>${esc(r.title)}</b><br><span class="muted">${esc(r.details)}</span></td><td>${esc(r.domain)}</td><td>${repairAction(r)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No repairs need attention.</td></tr>'}</tbody></table>`}
function history(){content.innerHTML=`<div class="panel"><div class="panel-h"><div></div><div class="toolbar"><button onclick="ackAllNotifications()">Acknowledge all open</button><button onclick="load().then(()=>history())">Refresh</button></div></div><div class="panel-b">${activityFeed()}<h3>Notifications</h3>${notificationTable(data.notifications)}<h3>Audit events</h3>${auditTable(data.audit)}<h3>Backups</h3>${backupTable(data.backups)}<h3>Operations</h3>${operationTable(data.operations)}</div></div>`}
function fmtTime(t){try{return new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch(e){return t||'—'}}
function activityRows(){return [...(data.audit||[]).map(x=>({time:x.timestamp,type:'audit',label:plainAction(x.action),result:x.result||'success',details:x.metadata||{}})),...(data.operations||[]).map(x=>({time:x.started_at,type:'operation',label:plainAction(x.kind)+' — '+(x.state||x.status||''),result:x.status,details:x.details||{}})),...(data.backups||[]).map(x=>({time:x.started_at,type:'backup',label:x.name||'Backup created',result:x.status,details:{backup_id:x.backup_id,instance_id:x.instance_id}})),...(data.notifications||[]).map(x=>({time:x.created_at,type:'notification',label:x.title,result:x.status,details:{severity:x.severity}}))].filter(x=>x.time).sort((a,b)=>String(b.time).localeCompare(String(a.time)))}
function activityFeed(){let rows=activityRows().slice(0,24);return `<div class="activityFeed">${rows.map(r=>`<div class="activityItem"><div class="activityTime">${esc(fmtTime(r.time))}</div><div class="activityType">${esc(r.type)}</div><div><div class="activityLabel">${esc(r.label)}</div><div class="muted">${esc(shortDetails(r.details))}</div></div><div class="activityResult ${esc(r.result)}">${esc(r.result||'success')}</div></div>`).join('')||'<div class="muted">No activity yet.</div>'}</div>`}
function shortDetails(d){if(!d)return '';if(d.instance||d.component)return [d.instance,d.component,d.reason].filter(Boolean).join(' · ');if(d.state)return d.state;if(d.severity)return d.severity;if(d.count!==undefined)return `${d.count} item(s)`;if(d.backup_id)return `backup ${d.backup_id}`;return Object.entries(d).slice(0,2).map(([k,v])=>`${k}: ${String(v).slice(0,60)}`).join(' · ')}
function backupTable(rows){return `<table><thead><tr><th>Started</th><th>Name</th><th>Status</th><th>Backup ID</th><th>Details</th></tr></thead><tbody>${(rows||[]).slice(0,80).map(b=>`<tr><td>${esc(b.started_at||'—')}</td><td>${esc(b.name||'backup')}</td><td>${esc(b.status)}</td><td>${esc(b.backup_id||'—')}</td><td>${esc(shortDetails(b.details||{}))}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No backups logged.</td></tr>'}</tbody></table>`}
function operationTable(rows){return `<table><thead><tr><th>Started</th><th>Kind</th><th>Status</th><th>State</th><th>Details</th></tr></thead><tbody>${(rows||[]).slice(0,80).map(o=>`<tr><td>${esc(o.started_at||'—')}</td><td>${esc(o.kind)}</td><td>${esc(o.status)}</td><td>${esc(o.state)}</td><td>${esc(shortDetails(o.details||{}))}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No operations logged.</td></tr>'}</tbody></table>`}
function auditTable(rows){return `<table><thead><tr><th>Time</th><th>Action</th><th>Result</th><th>Details</th></tr></thead><tbody>${rows.slice(0,80).map(a=>`<tr><td>${esc(a.timestamp)}</td><td>${plainAction(a.action)}</td><td>${esc(a.result||'success')}</td><td>${esc(shortDetails(a.metadata||{}))}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No history yet.</td></tr>'}</tbody></table>`}
function notificationTable(rows){return `<table><thead><tr><th>Severity</th><th>Message</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody>${rows.slice(0,80).map(n=>`<tr><td>${esc(n.severity)}</td><td><b>${esc(n.title)}</b><br><span class="muted">${esc(n.body)}</span></td><td>${esc(n.status)}</td><td>${esc(n.created_at)}</td><td>${n.status==='open'?`<button onclick="ackNotification(${n.id})">Acknowledge</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No notifications.</td></tr>'}</tbody></table>`}
function plainAction(a){return esc(String(a||'').replaceAll('_',' '))}
function settingsTabs(){let tabs=['Account','Notifications','OIDC','System','Instance config'];return `<div class="settingsTabs">${tabs.map(t=>`<button class="settingsTab ${settingsTab===t?'active':''}" onclick="setSettingsTab('${t}')">${t}</button>`).join('')}</div>`}
function setSettingsTab(t){settingsTab=t;localStorage.setItem('hafm-settings-tab',t);settings()}
function settings(){if(!['Account','Notifications','OIDC','System','Instance config'].includes(settingsTab))settingsTab='Account';content.innerHTML=`${settingsTabs()}<div class="settingsPanel">${settingsTab==='Account'?accountSettings():settingsTab==='Notifications'?notificationSettings():settingsTab==='OIDC'?oidcSettings():settingsTab==='System'?systemSettings():instanceConfigSettings()}</div>`}
function accountSettings(){let u=data.user||{};return `<div class="panel"><div class="panel-b"><label>Name</label><input id="setName" value="${esc(u.display_name||'')}"><label>Username</label><input id="setUsername" value="${esc(u.username||'')}"><label>Email</label><input id="setEmail" value="${esc(u.email||'')}"><label>Current password <span class="muted">required for email/password changes</span></label><input id="setCurrentPassword" type="password"><label>New password</label><input id="setNewPassword" type="password" placeholder="12+ characters"><p><button class="primary" onclick="saveUserSettings()">Save account</button></p><div id="settingsMsg" class="statusLine"></div></div></div>`}
function checked(v){return v?'checked':''}
function secretPlaceholder(configured,label='Configured — leave blank to keep'){return configured?label:'Paste value'}
function notificationSettings(){let n=data.notificationSettings||{};return `<div class="panel"><div class="panel-b"><h2>Notifications</h2><p class="muted">Configure outbound channels for Fleet Manager alerts. Saving does not send a test message.</p><div class="notificationGrid"><details class="channelCard"><summary><span>ntfy</span><span class="channelStatus">${n.ntfy_enabled?'Enabled':'Disabled'}</span></summary><div class="channelCardBody"><label class="checkRow"><input id="ntfyEnabled" type="checkbox" ${checked(n.ntfy_enabled)}><span><b>Enable ntfy</b><br><span class="muted">Push alerts to an ntfy topic.</span></span></label><label>Server URL</label><input id="ntfyUrl" placeholder="https://ntfy.sh" value="${esc(n.ntfy_url||'')}"><label>Topic</label><input id="ntfyTopic" value="${esc(n.ntfy_topic||'')}"><label>Access token</label><input id="ntfyToken" type="password" placeholder="${secretPlaceholder(n.ntfy_token_configured)}"><label class="checkRow"><input id="ntfyClear" type="checkbox"><span>Clear saved ntfy token</span></label><div class="channelActions"><button class="primary" onclick="saveNotificationSettings('ntfy')">Save ntfy</button><button onclick="testNotification('ntfy')">Send test notification</button></div></div></details><details class="channelCard"><summary><span>Pushover</span><span class="channelStatus">${n.pushover_enabled?'Enabled':'Disabled'}</span></summary><div class="channelCardBody"><label class="checkRow"><input id="pushoverEnabled" type="checkbox" ${checked(n.pushover_enabled)}><span><b>Enable Pushover</b><br><span class="muted">Send alerts through Pushover.</span></span></label><label>User key</label><input id="pushoverUserKey" type="password" placeholder="${secretPlaceholder(n.pushover_user_key_configured)}"><label>Application token</label><input id="pushoverAppToken" type="password" placeholder="${secretPlaceholder(n.pushover_app_token_configured)}"><label class="checkRow"><input id="pushoverClear" type="checkbox"><span>Clear saved Pushover secrets</span></label><div class="channelActions"><button class="primary" onclick="saveNotificationSettings('pushover')">Save pushover</button><button onclick="testNotification('pushover')">Send test notification</button></div></div></details><details class="channelCard"><summary><span>Email</span><span class="channelStatus">${n.email_enabled?'Enabled':'Disabled'}</span></summary><div class="channelCardBody"><label class="checkRow"><input id="emailNotifyEnabled" type="checkbox" ${checked(n.email_enabled)}><span><b>Enable email</b><br><span class="muted">SMTP configuration for email alerts.</span></span></label><label>To</label><input id="emailTo" placeholder="alerts@example.com" value="${esc(n.email_to||'')}"><label>From</label><input id="emailFrom" placeholder="fleet@example.com" value="${esc(n.email_from||'')}"><label>SMTP host</label><input id="smtpHost" value="${esc(n.smtp_host||'')}"><label>SMTP port</label><input id="smtpPort" type="number" min="1" max="65535" value="${esc(n.smtp_port||587)}"><label>SMTP username</label><input id="smtpUsername" value="${esc(n.smtp_username||'')}"><label>SMTP password</label><input id="smtpPassword" type="password" placeholder="${secretPlaceholder(n.smtp_password_configured)}"><label class="checkRow"><input id="smtpClear" type="checkbox"><span>Clear saved SMTP password</span></label><div class="channelActions"><button class="primary" onclick="saveNotificationSettings('email')">Save email</button><button onclick="testNotification('email')">Send test notification</button></div></div></details><details class="channelCard"><summary><span>Telegram</span><span class="channelStatus">${n.telegram_enabled?'Enabled':'Disabled'}</span></summary><div class="channelCardBody"><label class="checkRow"><input id="telegramEnabled" type="checkbox" ${checked(n.telegram_enabled)}><span><b>Enable Telegram</b><br><span class="muted">Send alerts via Telegram Bot API.</span></span></label><label>Bot token</label><input id="telegramBotToken" type="password" placeholder="${secretPlaceholder(n.telegram_bot_token_configured)}"><label>Chat ID</label><input id="telegramChatId" value="${esc(n.telegram_chat_id||'')}"><label class="checkRow"><input id="telegramClear" type="checkbox"><span>Clear saved Telegram bot token</span></label><div class="channelActions"><button class="primary" onclick="saveNotificationSettings('telegram')">Save telegram</button><button onclick="testNotification('telegram')">Send test notification</button></div></div></details></div><p><button class="primary" onclick="saveNotificationSettings()">Save notifications</button></p><div id="notificationMsg" class="statusLine"></div></div></div>`}
function val(id){return $(id)?.value||''}
function checkedEl(id){return !!$(id)?.checked}
function notificationPayload(){return {ntfy_enabled:checkedEl('ntfyEnabled'),ntfy_url:val('ntfyUrl'),ntfy_topic:val('ntfyTopic'),ntfy_token:val('ntfyToken')||null,ntfy_clear_token:checkedEl('ntfyClear'),pushover_enabled:checkedEl('pushoverEnabled'),pushover_user_key:val('pushoverUserKey')||null,pushover_app_token:val('pushoverAppToken')||null,pushover_clear_secrets:checkedEl('pushoverClear'),email_enabled:checkedEl('emailNotifyEnabled'),email_to:val('emailTo'),email_from:val('emailFrom'),smtp_host:val('smtpHost'),smtp_port:Number(val('smtpPort')||587),smtp_username:val('smtpUsername'),smtp_password:val('smtpPassword')||null,smtp_clear_password:checkedEl('smtpClear'),telegram_enabled:checkedEl('telegramEnabled'),telegram_bot_token:val('telegramBotToken')||null,telegram_chat_id:val('telegramChatId'),telegram_clear_token:checkedEl('telegramClear')}}
async function saveNotificationSettings(channel='notifications'){try{let body=notificationPayload();data.notificationSettings=await api('/api/notification-settings',{method:'PATCH',body});let label=channel==='notifications'?'Notifications':channel;notificationMsg.className='ok statusLine';notificationMsg.textContent=`${label} settings saved.`;notify(`${label} saved`,'ok');settings()}catch(e){notificationMsg.className='err statusLine';notificationMsg.textContent=e.message;notify(e.message,'err')}}
async function testNotification(channel){try{let body=notificationPayload();body.channel=channel;notificationMsg.className='statusLine';notificationMsg.textContent=`Sending ${channel} test…`;await api('/api/notification-settings/test',{method:'POST',body});notificationMsg.className='ok statusLine';notificationMsg.textContent=`${channel} test notification sent.`;notify(`${channel} test sent`,'ok')}catch(e){notificationMsg.className='err statusLine';notificationMsg.textContent=e.message;notify(e.message,'err')}}
function oidcSettings(){let o=data.oidc||{};return `<div class="panel"><div class="panel-b" aria-label="Single sign-on settings"><label class="checkRow"><input id="oidcEnabled" type="checkbox" ${o.enabled?'checked':''}><span><b>Enable OIDC</b><br><span class="muted">Adds a SSO option on the login screen.</span></span></label><label>Issuer URL</label><input id="oidcIssuer" placeholder="https://auth.example.com/application/o/fleet/" value="${esc(o.issuer_url||'')}"><label>Client ID</label><input id="oidcClientId" value="${esc(o.client_id||'')}"><label>Client secret</label><input id="oidcClientSecret" type="password" placeholder="${o.client_secret_configured?'Configured — leave blank to keep':'Paste client secret'}"><label>Scopes</label><input id="oidcScopes" value="${esc(o.scopes||'openid email profile')}"><label>Login button label</label><input id="oidcButtonLabel" value="${esc(o.button_label||'Sign in with SSO')}"><p class="muted">Redirect URI: <code>${location.origin}/api/auth/oidc/callback</code></p><p><button class="primary" onclick="saveOidcSettings()">Save SSO</button></p><div id="oidcMsg" class="statusLine"></div></div></div>`}
function scheduleRow(){return (data.schedules||[]).find(s=>['update_discovery','monitor_and_act'].includes(s.kind))||(data.schedules||[])[0]||{id:null,cron:'every 6h',enabled:true,last_run_at:null,kind:'update_discovery'}}
function systemSettings(){let s=scheduleRow();let freq=s.cron||'every 6h';let opts=['every 15m','every 30m','every 1h','every 2h','every 6h','every 12h','every 1d'].map(x=>`<option value="${x}" ${x===freq?'selected':''}>${x.replace('every ','Every ')}</option>`).join('');return `<div class="panel"><div class="panel-b"><h2>Update checks</h2><label class="checkRow"><input id="schedEnabled" type="checkbox" ${s.enabled?'checked':''}><span><b>Automatically check updates across instances</b><br><span class="muted">Runs in the Fleet Manager service and refreshes available updates. It does not install updates.</span></span></label><label>Check frequency</label><select id="schedFreq">${opts}</select><p class="muted">Last run: ${esc(s.last_run_at||'Never')}</p><p><button class="primary" onclick="saveSchedule()">Save system settings</button></p><div id="systemMsg" class="statusLine"></div></div></div>`}
async function saveSchedule(){try{let s=scheduleRow();if(!s.id)throw new Error('Schedule record not found');let body={name:'Fleet update check',kind:'monitor_and_act',cron:schedFreq.value,enabled:schedEnabled.checked};let saved=await api(`/api/schedules/${s.id}`,{method:'PATCH',body});data.schedules=[saved];systemMsg.className='ok statusLine';systemMsg.textContent='Saved.'}catch(e){systemMsg.className='err statusLine';systemMsg.textContent=e.message}}
function instanceConfigSettings(){return `<div class="panel"><div class="panel-h"><div></div><button class="primary" onclick="openAddInstance()">Add Instance</button></div><div class="panel-b" id="instancesTable">${instanceTable(data.instances)}</div></div>`}
async function saveUserSettings(){try{let body={display_name:setName.value,username:setUsername.value,email:setEmail.value,current_password:setCurrentPassword.value||null,new_password:setNewPassword.value||null};data.user=await api('/api/user/settings',{method:'PATCH',body});settingsMsg.className='ok statusLine';settingsMsg.textContent='Saved.';setCurrentPassword.value='';setNewPassword.value=''}catch(e){settingsMsg.className='err statusLine';settingsMsg.textContent=e.message}}
async function saveOidcSettings(){try{data.oidc=await api('/api/oidc/settings',{method:'PATCH',body:{enabled:oidcEnabled.checked,issuer_url:oidcIssuer.value,client_id:oidcClientId.value,client_secret:oidcClientSecret.value||null,scopes:oidcScopes.value,button_label:oidcButtonLabel.value}});oidcMsg.className='ok statusLine';oidcMsg.textContent='Saved.';await loadOidcConfig()}catch(e){oidcMsg.className='err statusLine';oidcMsg.textContent=e.message}}
function detail(id){let u=data.updates.find(x=>x.id===id);drawer.classList.add('open');drawer.innerHTML=`<button onclick="drawer.classList.remove('open')">Close</button><h2>${esc(u.component)}</h2><p><a href="#" onclick="openHaInstance(${u.instance_id});return false">${esc(u.instance||'')}</a> · ${esc(u.category)}</p><div class="toolbar">${updateActionButton(u)}<button class="iconAction danger" onclick="skipOne(${u.id})" title="Skip">⊘</button><button onclick="openHaEntity(${u.instance_id},'${esc(u.entity_id).replace(/'/g,'&#39;')}')">Open in HA</button></div><table><tr><th>Version</th><td>${esc(u.installed_version||'—')} → ${esc(u.available_version||'—')}</td></tr><tr><th>Risk</th><td class="${esc(u.risk_level)}">${esc(u.risk_level)}</td></tr><tr><th>Status</th><td>${rowStatus(u)}</td></tr></table><h3>Notes</h3><pre>${esc(u.breaking_excerpt||u.release_notes||'No release notes captured. Open the release link before updating if one is available.')}</pre>${u.release_url?`<p><a href="${esc(u.release_url)}" target="_blank" rel="noopener">Open release notes</a></p>`:''}`}
async function syncAll(){try{await api('/api/sync-all',{method:'POST'});await load();route(activePage||'Updates');notify('Refreshed','ok')}catch(e){notify(e.message,'err')}}async function syncOne(id){notify('Instance refresh started…');await api(`/api/instances/${id}/sync`,{method:'POST'});await load();route('Instances')}async function restartInstance(id,name){if(!await confirmDialog(`Restart ${name}? Home Assistant will be briefly unavailable.`,'Restart instance'))return;try{notify('Restart requested…');await api(`/api/instances/${id}/restart`,{method:'POST'});notify('Restart requested — instance marked restarting','ok');await load();route('Instances');setTimeout(async()=>{try{await load();route(activePage||'Instances')}catch(e){}},12000)}catch(e){notify(e.message,'err')}}async function backupOne(id){if(!await confirmDialog('Create Home Assistant backup for this instance now?','Confirm backup'))return;try{notify('Backup started…');let j=await api(`/api/instances/${id}/backup`,{method:'POST'});notify(`Backup ${j.status}${j.backup_id?`: ${j.backup_id}`:''}`,j.status==='completed'?'ok':'err');await Promise.all([load(),refreshActivity().catch(()=>{})]);route(activePage||'Settings')}catch(e){notify(e.message,'err')}}async function deleteInstance(id,name){if(!await confirmDialog(`Delete ${name}? This removes it from Fleet Manager only.`,'Delete instance'))return;try{await api(`/api/instances/${id}`,{method:'DELETE'});notify('Instance deleted.','ok');await load();route('Instances')}catch(e){notify(e.message,'err')}}async function ackNotification(id){await api(`/api/notifications/${id}/ack`,{method:'POST'});await load();route('Recent activity')}async function ackAllNotifications(){let open=(data.notifications||[]).filter(n=>n.status==='open').length;if(!open)return notify('No open notifications','ok');if(!await confirmDialog(`Acknowledge ${open} open notifications?`,'Acknowledge all'))return;let j=await api('/api/notifications/ack',{method:'POST',body:{ids:[]}});notify(`Acknowledged ${j.count} notifications`,'ok');await load();route('Recent activity')}
function instanceForm(i){let env=i?.environment||'Production';let opts=['Production','Secondary','Lab','Test','Household','Rental','Remote'].map(x=>`<option ${x===env?'selected':''}>${x}</option>`).join('');return `<div class="settingsGrid"><div><label>Friendly name</label><input id="afn" value="${esc(i?.friendly_name||'')}"></div><div><label>URL</label><input id="aurl" placeholder="https://ha.example" value="${esc(i?.url||'')}"></div><div><label>Environment</label><select id="aenv">${opts}</select></div><div><label>Location</label><input id="aloc" value="${esc(i?.location||'')}"></div><div><label>Tags</label><input id="atags" placeholder="comma separated" value="${esc((i?.tags||[]).join(', '))}"></div><div><label>Long-lived token</label><input id="atok" type="password" placeholder="${i?'Leave blank to keep existing token':''}"></div></div>`}
function openAddInstance(){drawer.classList.add('open');drawer.innerHTML=`<button onclick="drawer.classList.remove('open')">Close</button><h2>Add Instance</h2>${instanceForm(null)}<p><button class="primary" onclick="addInstance()">Test and save</button></p><div id="addErr" class="err"></div>`}
function openEditInstance(id){let i=instanceById(id);drawer.classList.add('open');drawer.innerHTML=`<button onclick="drawer.classList.remove('open')">Close</button><h2>Edit Instance</h2><p>${instanceStatus(i)}${statusInfo(i)} <span class="muted">Last check: ${esc(i?.last_update_scan||'—')}</span></p>${instanceForm(i)}<p><button class="primary" onclick="saveInstance(${id})">Test and save</button></p><div id="addErr" class="err"></div>`}
function instancePayload(includeBlankToken=false){let body={friendly_name:afn.value,url:aurl.value,environment:aenv.value,location:aloc.value,tags:atags.value.split(',').map(x=>x.trim()).filter(Boolean)};if(includeBlankToken||atok.value.trim())body.token=atok.value.trim();return body}
async function addInstance(){try{await api('/api/instances',{method:'POST',body:instancePayload(true)});drawer.classList.remove('open');await load();route(activePage==='Settings'?'Settings':'Instances')}catch(e){addErr.textContent=e.message}}
async function saveInstance(id){try{await api(`/api/instances/${id}`,{method:'PATCH',body:instancePayload(false)});drawer.classList.remove('open');notify('Instance updated.','ok');await load();route(activePage==='Settings'?'Settings':'Instances')}catch(e){addErr.textContent=e.message}}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}
boot();
</script>
</body>
