<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Assistant Update Command Center</title>
  <style>
    :root{--bg:#07111f;--panel:#0e1a2d;--panel2:#13233b;--text:#e8f1ff;--muted:#9eb3d3;--ok:#24d18f;--warn:#ffd166;--bad:#ff6b6b;--review:#8ab4ff;--line:#213653;--safe:#42e8c4}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:radial-gradient(circle at top left,#163766 0,#07111f 38%,#040914 100%);color:var(--text)}header{padding:28px clamp(16px,4vw,48px) 16px;display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap}.eyebrow{color:var(--safe);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12px}h1{margin:.25rem 0 0;font-size:clamp(28px,4vw,48px);line-height:1}.sub{color:var(--muted);margin-top:8px}.btn{background:linear-gradient(135deg,#1d9bf0,#6d5dfc);border:0;color:white;border-radius:999px;padding:11px 18px;font-weight:800;cursor:pointer;box-shadow:0 12px 28px rgba(29,155,240,.24)}main{padding:0 clamp(16px,4vw,48px) 40px}.grid{display:grid;gap:16px}.summary{grid-template-columns:repeat(6,minmax(120px,1fr));margin:18px 0}@media(max-width:1000px){.summary{grid-template-columns:repeat(2,1fr)}}.card{background:linear-gradient(180deg,rgba(19,35,59,.92),rgba(14,26,45,.92));border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 18px 45px rgba(0,0,0,.25);backdrop-filter:blur(8px)}.stat .label{color:var(--muted);font-size:13px}.stat .num{font-size:34px;font-weight:900;margin-top:6px}.instances{grid-template-columns:repeat(auto-fit,minmax(315px,1fr))}.inst-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;border:1px solid var(--line);background:#0b1728;color:var(--muted)}.pill.ok{color:#06150f;background:var(--ok)}.pill.bad{color:#2b0606;background:var(--bad)}.pill.primary{color:#03131a;background:var(--safe)}.meta{color:var(--muted);font-size:13px;margin:8px 0 12px}.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.mini{border:1px solid var(--line);border-radius:14px;padding:10px;background:rgba(0,0,0,.15)}.mini b{display:block;font-size:22px}.mini span{color:var(--muted);font-size:12px}table{width:100%;border-collapse:collapse;margin-top:12px;overflow:hidden;border-radius:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}tr:last-child td{border-bottom:0}.manual{color:var(--warn)}.review{color:var(--review)}.safe{color:var(--safe)}.err{color:var(--bad);white-space:pre-wrap}.empty{color:var(--ok);padding:20px 0;font-weight:800}.footer{color:var(--muted);font-size:12px;margin-top:18px}.spinner{opacity:.7}.policy{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.policy .card{padding:14px}.policy h3{margin:0 0 8px;font-size:15px}.policy p{margin:0;color:var(--muted);font-size:13px;line-height:1.35}a{color:#8ab4ff}
  </style>
</head>
<body>
<header>
  <div>
    <div class="eyebrow">LAN dashboard · read-only</div>
    <h1>Home Assistant Update Command Center</h1>
    <div class="sub">All instances, one update view. Core/HAOS are manual-only.</div>
  </div>
  <button class="btn" onclick="loadData(true)">Refresh now</button>
</header>
<main>
  <section class="summary grid" id="summary"></section>
  <section class="instances grid" id="instances"><div class="spinner">Loading…</div></section>
  <section class="policy" id="policy"></section>
  <div class="footer" id="footer"></div>
</main>
<script>
const policyLabels={manual_core_haos:'Manual Core/HAOS',needs_review:'Needs review',candidate_safe:'Safe candidate'};
const policyClass={manual_core_haos:'manual',needs_review:'review',candidate_safe:'safe'};
function stat(label,num){return `<div class="card stat"><div class="label">${label}</div><div class="num">${num}</div></div>`}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(data){
  const t=data.totals||{};
  document.getElementById('summary').innerHTML=[
    stat('Instances',t.instances??'—'),stat('Healthy',t.healthy??'—'),stat('Pending',t.pending??'—'),
    stat('Manual Core/HAOS',t.manual_core_haos??'—'),stat('Needs review',t.needs_review??'—'),stat('Safe candidates',t.candidate_safe??'—')
  ].join('');
  document.getElementById('instances').innerHTML=(data.instances||[]).map(inst=>{
    if(!inst.ok){return `<article class="card"><div class="inst-head"><div><h2>${esc(inst.label)}</h2><div class="meta">${esc(inst.url_host)}</div></div><span class="pill bad">DOWN</span></div><div class="err">${esc(inst.error)}</div></article>`}
    const p=inst.pending_by_policy||{};
    const rows=(inst.updates_pending||[]).map(u=>`<tr><td>${esc(u.title||u.entity_id)}<br><span class="meta">${esc(u.entity_id)}</span></td><td>${esc(u.installed_version)} → ${esc(u.latest_version)}</td><td class="${policyClass[u.policy]||''}">${policyLabels[u.policy]||u.policy}${u.in_progress?' · in progress':''}</td><td>${u.release_url?`<a href="${esc(u.release_url)}">release</a>`:'—'}</td></tr>`).join('');
    return `<article class="card"><div class="inst-head"><div><h2>${esc(inst.label)}</h2><div class="meta">${esc(inst.location_name)} · HA ${esc(inst.ha_version)} · ${esc(inst.url_host)}</div></div><div>${inst.role==='primary_residence'?'<span class="pill primary">PRIMARY</span> ':''}<span class="pill ok">OK</span></div></div><div class="bars"><div class="mini"><b>${inst.updates_pending_count}</b><span>pending</span></div><div class="mini"><b>${p.manual_core_haos||0}</b><span>manual</span></div><div class="mini"><b>${p.needs_review||0}</b><span>review</span></div></div>${rows?`<table><thead><tr><th>Update</th><th>Version</th><th>Policy</th><th>Notes</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">No pending updates</div>'}</article>`
  }).join('');
  document.getElementById('policy').innerHTML=`<div class="card"><h3>Manual-only</h3><p>${esc((data.policy?.manual||[]).join(', '))}</p></div><div class="card"><h3>Review-required</h3><p>${esc((data.policy?.review_required||[]).join(', '))}</p></div><div class="card"><h3>Auto-update rule</h3><p>${esc(data.policy?.safe_candidates)}</p></div>`;
  document.getElementById('footer').textContent=`Last refresh: ${data.generated_at_ct||'unknown'} CT · API: /api/updates`;
}
async function loadData(manual=false){
  if(manual) document.getElementById('footer').textContent='Refreshing…';
  try{const r=await fetch('/api/updates',{cache:'no-store'}); render(await r.json())}
  catch(e){document.getElementById('instances').innerHTML=`<div class="card err">${esc(e)}</div>`}
}
loadData(); setInterval(loadData, 5*60*1000);
</script>
</body>
</html>
